  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

mat('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Source Serif 4';\n  font-style: normal;\n  font-weight: 600;\n  font-display: swap;\n  src: url(\"c6bf0b5c-1572-4036-8c39-677551c1db83\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n\n\n:root {\n  --color-bg: #f3f2f2;\n  --color-surface: #eae9e9;\n  --color-text: #201e1d;\n  --color-accent: #0088b0;\n  --color-accent-2: #d6006c;\n  --color-divider: color-mix(in srgb, #201e1d 16%, transparent);\n\n  /* Tonal ramps — generated in OKLCH on one shared lightness scale, so the\n     same step of any role matches the others in visual value. */\n  --color-neutral-100: #f8f4f4;\n  --color-neutral-200: #eae7e7;\n  --color-neutral-300: #d7d3d3;\n  --color-neutral-400: #bab6b6;\n  --color-neutral-500: #9b9797;\n  --color-neutral-600: #7d7979;\n  --color-neutral-700: #605d5d;\n  --color-neutral-800: #444141;\n  --color-neutral-900: #2d2b2b;\n\n  --color-accent-100: #e9f8ff;\n  --color-accent-200: #cbeeff;\n  --color-accent-300: #99e0ff;\n  --color-accent-400: #62c5ee;\n  --color-accent-500: #38a6cf;\n  --color-accent-600: #1186ac;\n  --color-accent-700: #006786;\n  --color-accent-800: #004961;\n  --color-accent-900: #0a303e;\n\n  --color-accent-2-100: #fff1f4;\n  --color-accent-2-200: #ffdee6;\n  --color-accent-2-300: #ffc0d0;\n  --color-accent-2-400: #ff90b1;\n  --color-accent-2-500: #ff458e;\n  --color-accent-2-600: #d82071;\n  --color-accent-2-700: #aa0b56;\n  --color-accent-2-800: #790e3d;\n  --color-accent-2-900: #4b1528;\n\n  /* The third process ink — review round 3: the deck's print treatments\n     (the CMYK separation and the misregistered plate numerals below) need\n     the full four-color set. Cyan and magenta are the system's own accents;\n     this yellow completes them, muted to the same press-ink register. A\n     print treatment color, not an interface accent — body copy and chrome\n     never take it. */\n  --color-process-yellow: #edbb00;\n\n  --font-heading: \"Source Serif 4\", system-ui, sans-serif;\n  --font-heading-weight: 600;\n  --font-body: \"Source Serif 4\", system-ui, sans-serif;\n\n  --space-1: 5.0px;\n  --space-2: 10.0px;\n  --space-3: 15.0px;\n  --space-4: 20.0px;\n  --space-6: 30.0px;\n  --space-8: 40.0px;\n\n  --radius-sm: 1px;\n  --radius-md: 2px;\n  --radius-lg: 4px;\n\n  /* Elevation — derived from the ground: soft ink-tinted shadows on a\n     light theme, a hairline edge + ambient darkness on a dark one. */\n  --shadow-sm: 0 1px 2px color-mix(in srgb, #2d2b2b 14%, transparent);\n  --shadow-md: 0 3px 10px color-mix(in srgb, #2d2b2b 16%, transparent);\n  --shadow-lg: 0 12px 32px color-mix(in srgb, #2d2b2b 22%, transparent);\n}\n\nbody {\n  background: var(--color-bg);\n  color: var(--color-text);\n  font-family: var(--font-body);\n}\nh1, h2, h3, h4 { font-family: var(--font-heading); font-weight: var(--font-heading-weight); }\n\n.halftone{position:relative;filter:grayscale(0.35) contrast(1.15);overflow:hidden}\n.halftone::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The four-color separation treatment (review round 3) — a photograph\n   printed as its misregistered process plates, after the Catalogue Three\n   grammar. Markup: a figure.cmyk holding five copies of the image — the\n   first is the layout sizer (hidden), then one per plate, each tagged\n   .sep-c/.sep-m/.sep-y/.sep-k. The plates are extracted live by the SVG\n   feColorMatrix filters in print-plates.js, the system's own defs —\n   inlined in the compiled bundle every template page loads, and a\n   page that links styles.css directly adds\n   <script src=\"print-plates.js\"><\u002Fscript> itself (the defs must be in\n   the document: a data-URI filter reference would not survive Chromium,\n   and external-file references are unreliable across engines) — nudged\n   a few pixels out of register, and multiplied\n   onto the paper ground; the halftone dot screens the recombined print.\n   The plate offsets live with the deck's projection-scale CSS, since\n   misregistration is sized to the output. */\n.cmyk{position:relative;overflow:hidden;background:var(--color-bg)}\n.cmyk img:first-child{opacity:0} /* layout sizer AND the alt-bearing image — opacity\n  keeps it in the accessibility tree (visibility:hidden would drop the figure's only\n  description); fully transparent, it adds nothing to the multiply backdrop */\n.cmyk img+img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;mix-blend-mode:multiply}\n.cmyk .sep-c{filter:url(#sep-c)}\n.cmyk .sep-m{filter:url(#sep-m)}\n.cmyk .sep-y{filter:url(#sep-y)}\n.cmyk .sep-k{filter:url(#sep-k)}\n.cmyk::after{content:\"\";position:absolute;inset:0;pointer-events:none;\n  background-image:radial-gradient(circle,rgba(0,0,0,0.22) 30%,transparent 32%);\n  background-size:3px 3px;mix-blend-mode:multiply}\n\n/* The one-image separation (review round 9, promoted from the deck in the\n   landing divergence) — the same four plates as ONE compound filter,\n   #sep-all in print-plates.js, for a single swappable image: a .print\n   wrapper inside the figure holds one <image-slot>, and the filter\n   extracts, offsets and multiplies the plates live from whatever the slot\n   shows. Markup: figure.cmyk > .print > image-slot (the page sizes the\n   .print — aspect-ratio, or absolute fill for bleeds). Hover resolves\n   the print into the photograph — the pressman checking registration on\n   the light table — so the source shows crisp and any swap chrome stays\n   legible; only the reduced-motion fallback below still lifts as a\n   single cut (a url() filter cannot CSS-transition; the press driver\n   animates the defs instead). */\n.cmyk .print{position:relative;width:100%;filter:url(#sep-all)}\n/* no hover end-state swap: the press driver (print-plates.js) eases the\n   plates into register while purifying their inks to the pure-process\n   separation on the same curve, so the converged four-plate merge IS\n   the photograph (their multiply equals SourceGraphic by construction)\n   — no cut anywhere on the animated path */\n@media (prefers-reduced-motion: reduce), (hover: none), (pointer: coarse) {\n  .cmyk .print:hover{filter:none} /* without the driver (it stands down on\n    exactly these conditions), hover stays the old single cut to the\n    crisp source */\n}\n.cmyk .print image-slot{width:100%;height:100%;display:block}\n\n/* The plate numeral (review rounds 3-4) — display figures set as\n   misregistered process plates, the catalog's cover grammar. Review\n   round 4 (Barron): THREE plates — C, M, Y only, no black plate — so the\n   dark core comes entirely from the C×M×Y multiply overlap (the inks\n   product to exact black), with the fringes the registration drift; and\n   the spread pulled in by half (less jumbled: one figure with plate\n   fringes rather than figures sliding apart). Markup: a .cmyk-num holding\n   a .paper span (the white of the sheet: the glyph's union, built from\n   offset text-shadow copies) and three .plate spans. The construction\n   carries its own ground (--cmyk-num-ground, defaulting to paper) painted\n   on its padding box, so the multiply plates always have their backdrop\n   even inside an isolated stacking context (entrance animations); the\n   padding bleeds wider than any plate offset and the negative margin\n   hands the layout box back. Offsets are em-scaled to the glyph. The\n   .paper span carries the text once for assistive tech; the .plate spans\n   are aria-hidden repeats. */\n.cmyk-num{--cmyk-num-ground:var(--color-bg);\n  position:relative;width:fit-content;line-height:0.9;\n  font-feature-settings:\"pnum\" 1;\n  background:var(--cmyk-num-ground);padding:0.12em;margin:-0.12em}\n.cmyk-num .paper{color:var(--color-bg); /* the white of the sheet — always paper,\n  whatever the ground: the plates read as printed on paper even when the\n  surrounding page is ink */\n  text-shadow:0.036em 0.025em 0 var(--color-bg),-0.031em -0.023em 0 var(--color-bg)}\n.cmyk-num .plate{position:absolute;inset:0.12em;mix-blend-mode:multiply;\n  text-box:trim-both cap alphabetic /* the host trims to its cap box; each\n  absolute plate must trim its own line the same way, or its glyphs sit a\n  half-leading below the paper union */}\n.cmyk-num .plate-c{color:var(--color-accent)}\n\n/* The plate headline (divergence round 3, Barron: \"use both\" — the\n   photograph's plates AND the cover grammar's text plates, on the same\n   page). The same three-plate construction as .cmyk-num — paper span\n   carrying the real text, C/M/Y plate repeats, dark core from the\n   multiply overlap — at HALF the numeral's round-4 offsets: the serif's\n   display hairlines are thinner than the numeral strokes the spread was\n   measured on, and the full offsets swallow them whole (probed at the\n   hero's 80px — the fringes read as an anaglyph poster, not a breath\n   out of register) — recut for display\n   headlines that sit in running text blocks on the page's own paper:\n   no ground painting and no padding bleed (the numeral's ground exists\n   for isolated stacking contexts; a headline on the page multiplies\n   straight onto the sheet), no width:fit-content and no line-height\n   override (the host display class owns its metrics — apply this to\n   each .line, which is position:relative for its plates), and the\n   plates are inert to the hand (pointer-events/user-select none, so a\n   triple-click selects the headline once, not four times). Plates take\n   the same pointer lean as .cmyk-num. */\n.cmyk-head{position:relative}\n.cmyk-head .paper{color:var(--color-bg);\n  text-shadow:0.027em 0.0185em 0 var(--color-bg),-0.0245em -0.0175em 0 var(--color-bg)\n  /* the union's copies sit at the construction's halved plate offsets\n     PLUS the full lean (0.018+0.009 / 0.0125+0.006, and mirrored), so\n     the union still backs the plates at viewport-edge lean — invisible\n     on the page's own paper, load-bearing on any other ground */}\n.cmyk-head .plate{position:absolute;inset:0;mix-blend-mode:multiply;\n  pointer-events:none;user-select:none;\n  text-box:trim-both cap alphabetic /* match the host's trim, or the\n  plates sit a half-leading below the paper union */}\n.cmyk-head .plate-c{color:var(--color-accent)}\n.cmyk-head .plate-m{color:var(--color-accent-2);\n  translate:calc(0.018em + 0.009em*var(--press-nx, 0)) calc(0.0125em + 0.006em*var(--press-ny, 0))}\n.cmyk-head .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.0155em + 0.009em*var(--press-nx, 0)) calc(-0.0115em + 0.006em*var(--press-ny, 0))}\n.cmyk-num .plate-m{color:var(--color-accent-2);\n  translate:calc(0.036em + 0.018em*var(--press-nx, 0)) calc(0.025em + 0.0125em*var(--press-ny, 0))}\n.cmyk-num .plate-y{color:var(--color-process-yellow);\n  translate:calc(-0.031em + 0.018em*var(--press-nx, 0)) calc(-0.023em + 0.0125em*var(--press-ny, 0))}\n/* --press-nx/--press-ny: the pointer lean as a bare -1..1 factor,\n   published on :root by the press driver (print-plates.js) and zero\n   whenever the driver stands down. Each construction scales the lean to\n   its own spread (half of it, here as everywhere) so the moving plates\n   drift a breath toward the cursor and the C plate holds. */\n\n/* ══════════════════════════════════════════════════════════════════════════\n   Components — built with the tokens above. Plain CSS\n   on plain HTML: no JavaScript, no build step. Each class is documented in\n   readme.md and demonstrated in foundations/ and components/.\n   ══════════════════════════════════════════════════════════════════════ */\n\n*, *::before, *::after { box-sizing: border-box; }\nbody { margin: 0; font-size: 15px; line-height: 1.55; font-weight: 400; }\nh1, h2, h3, h4, h5, h6 {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  line-height: 1.12; letter-spacing: -0.015em; margin: 0 0 var(--space-2);\n}\nh1 { font-size: 42px; }\nh2 { font-size: 32px; }\nh3 { font-size: 25px; }\nh4 { font-size: 20px; }\nh5 { font-size: 16px; }\nh6 { font-size: 13px; }\nh6 { letter-spacing: 0.08em; text-transform: uppercase; }\np { margin: 0 0 var(--space-3); }\na { color: var(--color-accent); text-underline-offset: 3px; }\nimg { display: block; max-width: 100%; }\nfigure { margin: 0; }\nfigcaption {\n  font-size: 11px; margin-top: var(--space-1);\n  color: color-mix(in srgb, var(--color-text) 55%, transparent);\n}\n.text-muted { color: color-mix(in srgb, var(--color-text) 55%, transparent); }\n:focus { outline: none; }\n:focus-visible { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n::selection { background: color-mix(in srgb, var(--color-accent) 30%, transparent); }\n\n/* — rules — */\n.hr {\n  height: 1px; border: 0; margin: var(--space-4) 0;\n  background: var(--color-divider);\n}\n\n/* — buttons — */\n.btn {\n  display: inline-flex; align-items: center; justify-content: center; gap: 6px;\n  cursor: pointer; text-decoration: none;\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 14px; line-height: 1.2; color: var(--color-text); /* matches the .input's 14px —\n     the pair sits side by side in sign-up rows */\n  background: transparent; border: 1px solid transparent;\n  padding: var(--space-2) calc(var(--space-3) * 1.2);\n  border-radius: var(--radius-md);\n}\n.btn svg { display: block; }\n.btn:disabled { opacity: 0.45; cursor: not-allowed; }\n.btn-primary { background: var(--color-accent); color: var(--color-bg); }\n.btn-primary:hover { background: var(--color-accent-600); }\n.btn-primary:active { background: var(--color-accent-700); }\n.btn-secondary { border-color: var(--color-divider); }\n.btn-secondary:hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.btn-secondary:active { background: color-mix(in srgb, var(--color-text) 14%, transparent); }\n.btn-ghost { color: var(--color-accent); padding-inline: var(--space-1); }\n.btn-ghost:hover { background: color-mix(in srgb, var(--color-accent) 10%, transparent); }\n.btn-ghost:active { background: color-mix(in srgb, var(--color-accent) 18%, transparent); }\n.btn-icon { width: 36px; height: 36px; padding: 0; }\n.btn-block { width: 100%; margin-top: var(--space-2); }\n\n/* — forms — */\n.field > label {\n  display: block; font-size: 12px; margin-bottom: 5px;\n  color: color-mix(in srgb, var(--color-text) 70%, transparent);\n}\n.input {\n  width: 100%; min-height: 36px; padding: 6px 10px; font: inherit;\n  font-size: 14px; color: var(--color-text); caret-color: var(--color-accent);\n  background: var(--color-surface);\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.input::placeholder { color: color-mix(in srgb, var(--color-text) 65%, transparent); opacity: 1; }\n  /* explicit, measured: the browser default gray misses the 4.5:1 small-text bar on\n     the surface fill; 65% ink measures 4.8:1 there, still a step quieter than typed\n     text (opacity:1 overrides Firefox's default placeholder fade) */\n.input:hover { border-color: color-mix(in srgb, var(--color-text) 45%, transparent); }\n.input:focus-visible { border-color: var(--color-accent); outline-offset: 0; }\ntextarea.input { min-height: 90px; resize: vertical; }\n.radio { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }\n.radio input, .seg-opt input {\n  position: absolute; opacity: 0; width: 0; height: 0; pointer-events: none;\n}\n.radio .dot {\n  width: 16px; height: 16px; flex: none; border-radius: 50%;\n  border: 1.5px solid var(--color-divider);\n}\n.radio:hover .dot { border-color: var(--color-accent); }\n.radio input:checked + .dot {\n  border-color: var(--color-accent); background: var(--color-accent);\n  box-shadow: inset 0 0 0 4px var(--color-bg);\n}\n.radio input:focus-visible + .dot { outline: 2px solid var(--color-accent); outline-offset: 2px; }\n.seg {\n  display: inline-flex; overflow: hidden;\n  border: 1px solid var(--color-divider); border-radius: var(--radius-md);\n}\n.seg-opt {\n  display: inline-flex; align-items: center; gap: 6px;\n  padding: 7px 12px; font-size: 13px; cursor: pointer;\n}\n.seg-opt + .seg-opt { border-left: 1px solid var(--color-divider); }\n.seg-opt:has(input:checked) { background: var(--color-accent); color: var(--color-bg); }\n.seg-opt:not(:has(input:checked)):hover { background: color-mix(in srgb, var(--color-text) 7%, transparent); }\n.seg-opt:has(input:focus-visible) { outline: 2px solid var(--color-accent); outline-offset: -2px; }\n\n/* — cards — */\n.card {\n  display: flex; flex-direction: column; gap: var(--space-2);\n  padding: var(--space-3); border-radius: var(--radius-md); background: var(--color-surface);\n}\n.card-kicker { font-size: 10px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-accent); }\n.card-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 17px; line-height: 1.2;\n}\n.card-body { margin: 0; font-size: 13px; opacity: 0.8; flex: 1; }\n.card-meta {\n  display: flex; align-items: center; gap: 6px; font-size: 11px;\n  color: color-mix(in srgb, var(--color-text) 50%, transparent);\n}\n.elev-sm { box-shadow: var(--shadow-sm); }\n.elev-md { box-shadow: var(--shadow-md); }\n.elev-lg { box-shadow: var(--shadow-lg); }\n\n/* — tags — */\n.tag {\n  display: inline-flex; align-items: center; font-size: 11px;\n  letter-spacing: 0.02em; padding: 3px 10px;\n  border-radius: calc(var(--radius-md) * 0.75);\n}\n.tag-accent { background: var(--color-accent-100); color: var(--color-accent-800); }\n.tag-accent-2 { background: var(--color-accent-2-100); color: var(--color-accent-2-800); }\n.tag-neutral { background: var(--color-neutral-100); color: var(--color-neutral-800); }\n.tag-outline { border: 1px solid var(--color-accent); color: var(--color-accent); }\n\n/* — navigation — */\n.nav {\n  display: flex; align-items: center; gap: var(--space-4);\n  padding: var(--space-3) var(--space-4);\n  border-bottom: none;\n}\n.nav-brand {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 18px; margin-right: auto;\n}\n.nav a { color: inherit; text-decoration: none; font-size: 14px; }\n.nav a:hover, .nav a[aria-current='page'] { color: var(--color-accent); }\n\n/* — tables — */\n.table { width: 100%; border-collapse: collapse; font-size: 14px; }\n.table th {\n  text-align: left; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase;\n  color: color-mix(in srgb, var(--color-text) 60%, transparent);\n  padding: var(--space-2); border-bottom: 1px solid var(--color-divider);\n}\n.table td {\n  padding: var(--space-2);\n  border-bottom: 1px solid color-mix(in srgb, var(--color-text) 8%, transparent);\n}\n.table tbody tr:hover { background: color-mix(in srgb, var(--color-text) 4%, transparent); }\n\n/* — dialog — */\n.dialog-backdrop {\n  position: fixed; inset: 0; display: grid; place-items: center;\n  padding: var(--space-4);\n  background: color-mix(in srgb, var(--color-neutral-900) 50%, transparent);\n}\n.dialog {\n  width: min(440px, 100%); display: flex; flex-direction: column; gap: var(--space-3);\n  padding: var(--space-4); border-radius: var(--radius-lg);\n  background: var(--color-surface); box-shadow: var(--shadow-lg);\n}\n.dialog-title {\n  font-family: var(--font-heading); font-weight: var(--font-heading-weight);\n  font-size: 20px;\n}\n.dialog-body { font-size: 14px; opacity: 0.85; }\n.dialog-actions { display: flex; justify-content: flex-end; gap: var(--space-2); margin-top: var(--space-2); }\n\n<\u002Fstyle>\n<script src=\"0598aeea-0f10-4362-a51c-a2652366dcb3\"><\u002Fscript>\n<script src=\"9e3da862-6724-4c68-8b46-f991bb782729\"><\u002Fscript>\n\n<link rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n<style>/* cyrillic-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"74d573ed-dddb-46a9-ab0d-7ed4d7e119d5\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"d3c00bcc-3ed4-42ef-b706-34155110e3dc\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"1a22e063-443d-4e54-bdc6-03bd9bfe4058\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"b7033acf-c49b-4ce1-8528-2f591a54c2b5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 700;\n  font-display: swap;\n  src: url(\"74d573ed-dddb-46a9-ab0d-7ed4d7e119d5\") format('woff2');\n  unicode-range: U+0460 : 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"1a22e063-443d-4e54-bdc6-03bd9bfe4058\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Plus Jakarta Sans';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"b7033acf-c49b-4ce1-8528-2f591a54c2b5\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n:root{\n  --tps-purple:#8B5CF6; --tps-purple-100:#EFE9FE; --tps-purple-200:#DCD0FC; --tps-purple-700:#6D28D9;\n  --tps-orange:#FFB648; --tps-orange-100:#FFF1DA; --tps-blue:#8FD3F4; --tps-blue-100:#E7F6FC;\n  --tps-green:#B8E3A0; --tps-green-100:#EAF7E2;\n  --tps-pink:#FB7DA8; --tps-pink-100:#FFE3ED; --tps-pink-700:#C23368;\n  --tps-ink:#171521; --tps-bg:#F6F3FC;\n  --tps-radius-sm:14px; --tps-radius-md:22px; --tps-radius-lg:28px;\n  --tps-font-heading:'Plus Jakarta Sans',sans-serif; --tps-font-body:'Plus Jakarta Sans',sans-serif;\n  --tps-card:#fff; --tps-sub:#5A5468; --tps-sub2:#8A8397; --tps-hero-sub:#3A3547; --tps-inkfix:#171521;\n}\n.tps-dark{\n  --tps-bg:#171521; --tps-ink:#F0EDF7; --tps-card:#221D33;\n  --tps-purple-100:#2C2340; --tps-purple-200:#3A2D57;\n  --tps-orange-100:#3A2E1A; --tps-blue-100:#1E2E36; --tps-green-100:#20301C; --tps-pink-100:#3A1E2C;\n  --tps-sub:#B7B0C9; --tps-sub2:#9088A3; --tps-hero-sub:#C9C2DA;\n}\nbody{margin:0;padding-bottom:calc(120px + env(safe-area-inset-bottom));background:var(--tps-bg);color:var(--tps-ink);font-family:var(--tps-font-body);padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right);overflow-x:hidden}\n*{box-sizing:border-box}\na{color:var(--tps-purple-700)}\na:hover{color:var(--tps-ink)}\n.tps-row{display:flex;align-items:center;gap:16px;padding:18px 16px;cursor:pointer;background:var(--tps-card);border-radius:var(--tps-radius-md);margin-bottom:10px;transition:transform .15s ease,box-shadow .15s ease;box-shadow:0 6px 18px rgba(23,21,33,.06)}\n.tps-row:hover{transform:translateY(-2px);box-shadow:0 10px 24px rgba(23,21,33,.1)}\n.tps-row:hover .tps-row-title{color:var(--tps-purple-700)}\n.tps-chip{width:46px;height:46px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:none;font-family:var(--tps-font-heading);font-size:19px;color:#fff}\n.tps-row-title{font-family:var(--tps-font-heading);font-size:18px;font-weight:700}\n.tps-arrow{margin-left:auto;font-size:18px;color:#C9C4DA;transition:transform .15s ease}\n.tps-row:hover .tps-arrow{transform:translateX(4px);color:var(--tps-purple-700)}\nh1,h2,.card-title,.card-kicker{font-family:var(--tps-font-heading)}\n.card{border-radius:var(--tps-radius-md) !important;border:none !important;box-shadow:0 6px 20px rgba(23,21,33,.06) !important;background:var(--tps-card) !important;color:var(--tps-ink) !important}\n.card-kicker{color:var(--tps-purple-700) !important;font-weight:700 !important;letter-spacing:.04em}\n.btn{border-radius:999px !important;font-family:var(--tps-font-heading) !important;font-weight:700 !important;border:none !important}\n.btn-primary{background:var(--tps-inkfix) !important;color:#fff !important}\n.btn-secondary{background:var(--tps-purple-100) !important;color:var(--tps-purple-700) !important}\n.btn-ghost{background:transparent !important;color:var(--tps-ink) !important}\n.tag{border-radius:999px !important;font-family:var(--tps-font-heading) !important;font-weight:700 !important}\n.tag-accent{background:var(--tps-purple-100) !important;color:var(--tps-purple-700) !important}\n.tag-accent-2{background:var(--tps-pink-100) !important;color:var(--tps-pink-700) !important}\n.radio{border-radius:var(--tps-radius-sm) !important}\n.field label{font-family:var(--tps-font-heading) !important;font-weight:700 !important;font-size:12px !important;text-transform:uppercase;letter-spacing:.04em}\n.seg-opt{border-radius:999px !important;font-weight:700}\n.input,select.input{border-radius:var(--tps-radius-sm) !important}\n@media (max-width:600px){\n  .tps-page-pad{padding-left:var(--space-4) !important;padding-right:var(--space-4) !important}\n  .tps-hero-pad{padding:var(--space-5) var(--space-4) !important}\n  .tps-hero-title{font-size:26px !important}\n  .tps-h1{font-size:24px !important}\n  .tps-h2{font-size:18px !important}\n  .tps-cards-grid{grid-template-columns:1fr !important;gap:var(--space-3) !important}\n  .tps-dashboard-grid{grid-template-columns:repeat(2,1fr) !important}\n  .tps-stats-row{flex-wrap:wrap !important}\n  .tps-topbar-date{display:none !important}\n}\n.tps-bottomnav{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom));transform:translateX(-50%);display:flex;gap:6px;background:var(--tps-card);border-radius:999px;padding:8px;box-shadow:0 10px 30px rgba(23,21,33,.15);z-index:50;pointer-events:auto;max-width:calc(100vw - 24px);transition:transform .28s ease,opacity .28s ease}\n.tps-bottomnav.tps-nav-hidden{transform:translateX(-50%) translateY(calc(100% + 24px + env(safe-area-inset-bottom)));opacity:0;pointer-events:none}\n.tps-navbtn{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;line-height:1;color:var(--tps-ink);background:transparent;transition:background .15s ease}\n.tps-navbtn.active{background:var(--tps-inkfix);color:#fff}\n<\u002Fstyle>\n\n<div class=\"{{ darkClass }}\" style=\"min-height:100vh;background:var(--tps-bg);color:var(--tps-ink)\">\n\n<div class=\"tps-page-pad\" style=\"max-width:960px;margin:0 auto;padding:calc(var(--space-5) + env(safe-area-inset-top)) var(--space-6) var(--space-3);display:flex;align-items:center;justify-content:space-between;gap:10px\">\n  <div style=\"font-family:var(--tps-font-heading);font-size:20px;font-weight:800;letter-spacing:-0.01em;cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap\" sc-camel-on-click=\"{{ goHome }}\">Test Professioni Sanitarie<\u002Fdiv>\n  <div style=\"display:flex;align-items:center;gap:14px;flex:none\">\n    <div class=\"tps-topbar-date\" style=\"font-size:12px;color:var(--tps-sub2);text-transform:uppercase;letter-spacing:.06em;white-space:nowrap\">{{ dateline }}<\u002Fdiv>\n    <div sc-camel-on-click=\"{{ toggleDark }}\" style=\"cursor:pointer;width:36px;height:36px;border-radius:50%;background:var(--tps-purple-100);display:flex;align-items:center;justify-content:center\" title=\"Modalità scura\">\n      <sc-if value=\"{{ dark }}\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--tps-purple-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"4\"><\u002Fcircle><path d=\"M12 2v2M12 20v2M4 12H2M22 12h-2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4\"><\u002Fpath><\u002Fsvg>\n      <\u002Fsc-if>\n      <sc-if value=\"{{ !dark }}\">\n        <svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"var(--tps-purple-700)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z\"><\u002Fpath><\u002Fsvg>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"tps-bottomnav {{ navHiddenClass }}\">\n  <div class=\"tps-navbtn {{ navHomeActive }}\" sc-camel-on-click=\"{{ goHome }}\" title=\"Home\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M3 11.5 12 4l9 7.5\"><\u002Fpath><path d=\"M5 10v9a1 1 0 0 0 1 1h4v-6h4v6h4a1 1 0 0 0 1-1v-9\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n  <div class=\"tps-navbtn {{ navStatsActive }}\" sc-camel-on-click=\"{{ goDashboard }}\" title=\"Statistiche\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 20V10M12 20V4M19 20v-7\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n  <div class=\"tps-navbtn {{ navBrowseActive }}\" sc-camel-on-click=\"{{ goBrowse }}\" title=\"Risposte\"><svg width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h16M4 12h16M4 18h16\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n<\u002Fdiv>\n\n<sc-if value=\"{{ !ready }}\" hint-placeholder-val=\"{{ true }}\">\n  <div style=\"padding:var(--space-8);font-family:var(--tps-font-heading);font-size:20px;color:var(--tps-sub2)\">Caricamento domande…<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ readyHome }}\">\n<div class=\"tps-page-pad\" style=\"max-width:960px;margin:0 auto;padding:var(--space-3) var(--space-6) var(--space-6)\">\n  <div class=\"tps-hero-pad\" style=\"background:var(--tps-purple-200);border-radius:var(--tps-radius-lg);padding:var(--space-7) var(--space-6);margin-bottom:var(--space-6);box-shadow:0 10px 26px rgba(23,21,33,.1);display:flex;flex-direction:column;align-items:center;text-align:center\">\n    <div style=\"font-size: 13px; font-weight: 700; letter-spacing: .04em; text-transform: uppercase; color: var(--tps-purple-700); margin: 0 0 10px\">Allenamento d'ingresso<\u002Fdiv>\n    <h1 class=\"tps-hero-title\" style=\"font-size: 38px; line-height: 1.1; font-weight: 800; letter-spacing: -0.01em; margin: 0 0 var(--space-3); max-width: 520px\">Preparati al test delle professioni sanitarie<\u002Fh1>\n    <p style=\"font-size: 15px; color: var(--tps-hero-sub); max-width: 480px; line-height: 1.55; margin: 0\">{{ totalQuestions }} quesiti reali su cinque materie, da prove ufficiali CINECA. {{ homeSimCountLabel }}<\u002Fp>\n  <\u002Fdiv>\n\n  <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--tps-sub2);margin-bottom:var(--space-4)\">Come vuoi esercitarti<\u002Fdiv>\n  <sc-if value=\"{{ totalErrorCount }}\">\n    <div style=\"background:var(--tps-pink-100);border-radius:var(--tps-radius-lg);padding:var(--space-5);cursor:pointer;margin-bottom:var(--space-4);display:flex;align-items:center;gap:var(--space-4);box-shadow:0 8px 22px rgba(23,21,33,.08)\" sc-camel-on-click=\"{{ startErrorReview }}\">\n      <div style=\"width:40px;height:40px;border-radius:50%;background:var(--tps-pink);display:flex;align-items:center;justify-content:center;flex:none\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#171521\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 9v4M12 17h.01M10.3 3.9 2.7 17.3a2 2 0 0 0 1.7 3h15.2a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"flex:1\"><div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:17px\">Ripassa gli errori<\u002Fdiv><div style=\"font-size:13px;color:var(--tps-sub)\">{{ totalErrorCount }} domande da rivedere, mischiate da tutte le materie<\u002Fdiv><\u002Fdiv>\n      <div style=\"font-size:18px;color:var(--tps-ink)\">→<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n  <div class=\"tps-cards-grid\" style=\"display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-4);margin-bottom:var(--space-6)\">\n    <div style=\"background:var(--tps-orange-100);border-radius:var(--tps-radius-lg);padding:var(--space-5);cursor:pointer;box-shadow:0 8px 22px rgba(23,21,33,.08);display:flex;flex-direction:column;align-items:center;text-align:center\" sc-camel-on-click=\"{{ goSimSetup }}\">\n      <div style=\"width:40px;height:40px;border-radius:50%;background:var(--tps-orange);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#171521\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"13\" r=\"8\"><\u002Fcircle><path d=\"M12 9v4l3 2M9 2h6\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:18px;margin-bottom:6px\">Simulazione a tempo<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--tps-sub)\">60 domande, punteggio ufficiale CINECA<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tps-blue-100);border-radius:var(--tps-radius-lg);padding:var(--space-5);cursor:pointer;box-shadow:0 8px 22px rgba(23,21,33,.08);display:flex;flex-direction:column;align-items:center;text-align:center\" sc-camel-on-click=\"{{ goRandomSetup }}\">\n      <div style=\"width:40px;height:40px;border-radius:50%;background:var(--tps-blue);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#171521\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M17 3 7 21M3 12h18M17 21 7 3\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:18px;margin-bottom:6px\">Domande casuali<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--tps-sub)\">Mix da tutti gli anni disponibili<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tps-green-100);border-radius:var(--tps-radius-lg);padding:var(--space-5);cursor:pointer;box-shadow:0 8px 22px rgba(23,21,33,.08);display:flex;flex-direction:column;align-items:center;text-align:center\" sc-camel-on-click=\"{{ goCategorySetup }}\">\n      <div style=\"width:40px;height:40px;border-radius:50%;background:var(--tps-green);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#171521\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:18px;margin-bottom:6px\">Apprendimento<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--tps-sub)\">Spiegazione dopo ogni risposta<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tps-pink-100);border-radius:var(--tps-radius-lg);padding:var(--space-5);cursor:pointer;box-shadow:0 8px 22px rgba(23,21,33,.08);display:flex;flex-direction:column;align-items:center;text-align:center\" sc-camel-on-click=\"{{ goBrowse }}\">\n      <div style=\"width:40px;height:40px;border-radius:50%;background:var(--tps-pink);display:flex;align-items:center;justify-content:center;margin-bottom:var(--space-4)\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#171521\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 6h16M4 12h16M4 18h16\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n      <div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:18px;margin-bottom:6px\">Consultazione<\u002Fdiv>\n      <div style=\"font-size:13px;color:var(--tps-sub)\">Tutte le domande e spiegazioni<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"font-size:13px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;color:var(--tps-sub2);margin-bottom:var(--space-4)\">Il tuo andamento<\u002Fdiv>\n  <div style=\"display:flex;gap:var(--space-4);flex-wrap:wrap\">\n    <div style=\"background:var(--tps-green-100);border-radius:999px;padding:14px 22px;flex:1;min-width:140px;box-shadow:0 6px 16px rgba(23,21,33,.06)\">\n      <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;color:#4A7A34\">Simulazioni<\u002Fdiv>\n      <div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:22px\">{{ stats.totalAttempts }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tps-blue-100);border-radius:999px;padding:14px 22px;flex:1;min-width:140px;box-shadow:0 6px 16px rgba(23,21,33,.06)\">\n      <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;color:#2D6E8E\">Punteggio medio<\u002Fdiv>\n      <div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:22px\">{{ stats.avgPctLabel }}<\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"background:var(--tps-orange-100);border-radius:999px;padding:14px 22px;flex:1;min-width:140px;cursor:pointer;box-shadow:0 6px 16px rgba(23,21,33,.06)\" sc-camel-on-click=\"{{ goDashboard }}\">\n      <div style=\"font-size:11px;font-weight:700;text-transform:uppercase;color:#A5680B\">Domande esercitate<\u002Fdiv>\n      <div style=\"font-family:var(--tps-font-heading);font-weight:800;font-size:22px\">{{ stats.totalSeen }} →<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isSimSetup }}\">\n<div style=\"background:var(--tps-purple-100)\">\n<div class=\"tps-page-pad\" style=\"max-width:760px;margin:0 auto;padding:var(--space-7) var(--space-6) var(--space-6)\">\n  <div style=\"font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:var(--tps-purple-700);margin:0 0 10px\">Simulazione a tempo<\u002Fdiv>\n  <h1 style=\"font-family:var(--tps-font-heading);font-size:38px;font-weight:400;letter-spacing:-0.01em;margin:0\">Scegli l'anno della prova<\u002Fh1>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"tps-page-pad\" style=\"max-width:760px;margin:0 auto;padding:var(--space-6)\">\n  <sc-for list=\"{{ yearCards }}\" as=\"yc\" hint-placeholder-count=\"3\">\n    <div class=\"tps-row\" style=\"{{ yc.rowStyle }}\" sc-camel-on-click=\"{{ yc.onSelect }}\">\n      <div class=\"tps-chip\" style=\"{{ yc.chipBg }}\">{{ yc.mark }}<\u002Fdiv>\n      <div><div class=\"tps-row-title tps-idx-title\">{{ yc.label }} · {{ yc.ateneo }}<\u002Fdiv><div style=\"font-size:14px;color:var(--color-neutral-700)\">{{ yc.count }} domande · {{ yc.historyLabel }}<\u002Fdiv><\u002Fdiv>\n      <div class=\"tps-arrow\">→<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n\n  <div class=\"field\" style=\"margin-top:var(--space-7)\">\n    <label>Tempo a disposizione (minuti)<\u002Flabel>\n    <div class=\"seg\">\n      <sc-for list=\"{{ minuteOptions }}\" as=\"mo\" hint-placeholder-count=\"4\">\n        <div class=\"seg-opt\" style=\"cursor:pointer;background:{{ mo.bg }}\" sc-camel-on-click=\"{{ mo.onSelect }}\">{{ mo.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <button class=\"btn btn-primary\" style=\"margin-top:var(--space-6)\" sc-camel-on-click=\"{{ startSimulation }}\" disabled=\"{{ !simYear }}\">Inizia simulazione<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isRandomSetup }}\">\n<div class=\"tps-page-pad\" style=\"max-width:760px;margin:0 auto;padding:var(--space-6)\">\n  <h1 class=\"tps-h1\" style=\"font-family:var(--tps-font-heading);font-size:32px;font-weight:400;margin:0 0 var(--space-5)\">Domande casuali<\u002Fh1>\n  <p style=\"color:var(--color-neutral-700);margin:0 0 var(--space-5)\">Un mix di domande scelte a caso tra tutti gli anni disponibili ({{ totalQuestions }} totali).<\u002Fp>\n  <div class=\"field\">\n    <label>Quante domande?<\u002Flabel>\n    <div class=\"seg\">\n      <sc-for list=\"{{ randomCountOptions }}\" as=\"rc\" hint-placeholder-count=\"4\">\n        <div class=\"seg-opt\" style=\"cursor:pointer;background:{{ rc.bg }}\" sc-camel-on-click=\"{{ rc.onSelect }}\">{{ rc.label }}<\u002Fdiv>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <button class=\"btn btn-primary\" style=\"margin-top:var(--space-6)\" sc-camel-on-click=\"{{ startRandom }}\">Inizia<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isCategorySetup }}\">\n<div class=\"tps-page-pad\" style=\"max-width:760px;margin:0 auto;padding:var(--space-6  d.bg }};color:{{ d.color }};border:1px solid var(--color-neutral-300)\" sc-camel-on-click=\"{{ d.onGo }}\">{{ d.num }}<\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div class=\"card elev-sm\">\n    <div class=\"card-kicker\">Domanda {{ currentQ.index }} di {{ currentQ.total }} · {{ currentQ.categoryLabel }}<\u002Fdiv>\n    <div class=\"card-title\" style=\"font-size:19px;line-height:1.4;font-weight:400\">{{ currentQ.text }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)\">\n      <sc-for list=\"{{ currentQ.options }}\" as=\"opt\" hint-placeholder-count=\"5\">\n        <label class=\"radio\" style=\"cursor:pointer;padding:var(--space-2);border-radius:var(--tps-radius-sm);background:{{ opt.bg }}\" sc-camel-on-click=\"{{ opt.onSelect }}\">\n          <span class=\"dot\" style=\"{{ opt.dotStyle }}\"><\u002Fspan>\n          <span><strong>{{ opt.letter }})<\u002Fstrong> {{ opt.text }}<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"display:flex;justify-content:space-between;margin-top:var(--space-5)\">\n    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ prevQuestion }}\" disabled=\"{{ currentQ.isFirst }}\">← Precedente<\u002Fbutton>\n    <div style=\"display:flex;gap:var(--space-3)\">\n      <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ finishTest }}\">Termina e correggi<\u002Fbutton>\n      <sc-if value=\"{{ !currentQ.isLast }}\">\n        <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ nextQuestion }}\">Successiva →<\u002Fbutton>\n      <\u002Fsc-if>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isReview }}\">\n<div style=\"max-width:800px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-9)\">\n  <h1 style=\"font-family:var(--tps-font-heading);font-size:32px;font-weight:400;margin:0 0 var(--space-2)\">Risultato<\u002Fh1>\n  <div style=\"display:grid;grid-template-co ctice.total }}<\u002Fdiv>\n  <div class=\"card elev-sm\">\n    <sc-if value=\"{{ practice.categoryLabel }}\">\n      <div class=\"card-kicker\" style=\"margin-bottom:6px\">{{ practice.categoryLabel }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <div class=\"card-title\" style=\"font-size:19px;line-height:1.4;font-weight:400\">{{ practice.text }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)\">\n      <sc-for list=\"{{ practice.options }}\" as=\"opt\" hint-placeholder-count=\"5\">\n        <label class=\"radio\" style=\"cursor:pointer;padding:var(--space-2);border-radius:var(--tps-radius-sm);background:{{ opt.bg }}\" sc-camel-on-click=\"{{ opt.onSelect }}\">\n          <span class=\"dot\" style=\"{{ opt.dotStyle }}\"><\u002Fspan>\n          <span><strong>{{ opt.letter }})<\u002Fstrong> {{ opt.text }}<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ practice.answered }}\">\n      <div class=\"card-body\" style=\"margin-top:var(--space-4);font-style:italic;color:var(--color-neutral-700)\">{{ practice.explanation }}<\u002Fdiv>\n      <button class=\"btn btn-primary\" style=\"margin-top:var(--space-4)\" sc-camel-on-click=\"{{ practiceNext }}\">{{ practice.nextLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <sc-if value=\"{{ practice.finished }}\">\n    <div class=\"card\" style=\"margin-top:var(--space-5)\">\n      <div class=\"card-kicker\">Sessione completata<\u002Fdiv>\n      <div class=\"card-title\">{{ practice.finalScoreLabel }}<\u002Fdiv>\n      <button class=\"btn btn-secondary\" style=\"margin-top:var(--space-3)\" sc-camel-on-click=\"{{ goCategorySetup }}\">Torna alle materie<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isBrowse }}\">\n<div class=\"tps-page-pad\" style=\"max-width:820px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-9)\">\n  <h1 class=\"tps-h1\" style=\"font-family:
