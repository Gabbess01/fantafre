  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

ound:var(--tps-purple)\"><\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"display:flex;gap:var(--space-3);flex-wrap:wrap\">\n        <button class=\"btn btn-secondary\" sc-camel-on-click=\"{{ cc.onPractice }}\">Esercitati (tutti gli argomenti)<\u002Fbutton>\n        <sc-if value=\"{{ cc.hasErrors }}\">\n          <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ cc.onPracticeErrors }}\">Ripassa errori ({{ cc.errorCount }})<\u002Fbutton>\n        <\u002Fsc-if>\n      <\u002Fdiv>\n      <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-top:var(--space-3)\">\n        <sc-for list=\"{{ cc.subs }}\" as=\"sb\" hint-placeholder-count=\"3\">\n          <button class=\"btn btn-ghost\" style=\"font-size:12px;padding:6px 12px;background:var(--tps-bg)\" sc-camel-on-click=\"{{ sb.onClick }}\">{{ sb.label }} ({{ sb.count }})<\u002Fbutton>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isTestRunning }}\">\n<div class=\"tps-page-pad\" style=\"max-width:760px;margin:0 auto;padding:var(--space-6)\">\n  <div style=\"display:flex;justify-content:space-between;align-items:baseline;margin-bottom:var(--space-4);flex-wrap:wrap;gap:8px\">\n    <div class=\"tag tag-accent\">{{ testHeaderLabel }}<\u002Fdiv>\n    <div style=\"font-family:var(--tps-font-heading);font-size:22px\">{{ timeLeftLabel }}<\u002Fdiv>\n  <\u002Fdiv>\n  <div style=\"display:flex;flex-wrap:wrap;gap:6px;margin-bottom:var(--space-6)\">\n    <sc-for list=\"{{ progressDots }}\" as=\"d\" hint-placeholder-count=\"60\">\n      <div style=\"width:22px;height:22px;border-radius:50%;font-size:10px;display:flex;align-items:center;justify-content:center;cursor:pointer;background:{{ d.bg }};color:{{ d.color }};border:1px solid var(--color-neutral-300)\" sc-camel-on-click=\"{{ d.onGo }}\">{{ d.num }}<\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <div class=\"card elev-sm\">\n    <div class=\"card-kicker\">Domanda {{ currentQ.index }} di {{ d-kicker\">Corrette<\u002Fdiv><div class=\"card-title\">{{ review.correct }}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-kicker\">Errate<\u002Fdiv><div class=\"card-title\">{{ review.wrong }}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-kicker\">Non date<\u002Fdiv><div class=\"card-title\">{{ review.blank }}<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:var(--tps-font-heading);font-size:22px;font-weight:400;margin:0 0 var(--space-4)\">Rivedi le tue risposte<\u002Fh2>\n  <sc-for list=\"{{ review.items }}\" as=\"it\" hint-placeholder-count=\"10\">\n    <div class=\"card\" style=\"margin-bottom:var(--space-4);border-left:4px solid {{ it.stripColor }}\">\n      <div class=\"card-kicker\">Domanda {{ it.num }} · {{ it.categoryLabel }} · {{ it.yearLabel }}<\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:16px;font-weight:400\">{{ it.text }}<\u002Fdiv>\n      <sc-for list=\"{{ it.options }}\" as=\"op\" hint-placeholder-count=\"5\">\n        <div style=\"padding:6px 0;color:{{ op.textColor }};font-weight:{{ op.weight }}\">{{ op.letter }}) {{ op.text }} {{ op.badge }}<\u002Fdiv>\n      <\u002Fsc-for>\n      <div class=\"card-body\" style=\"margin-top:var(--space-3);font-style:italic;color:var(--color-neutral-700)\">{{ it.explanation }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n  <button class=\"btn btn-primary\" sc-camel-on-click=\"{{ goHome }}\">Torna alla home<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isPractice }}\">\n<div style=\"max-width:700px;margin:0 auto;padding:var(--space-6)\">\n  <div class=\"tag tag-accent-2\" style=\"margin-bottom:var(--space-4)\">{{ practice.headerLabel }} · {{ practice.index }}/{{ practice.total }}<\u002Fdiv>\n  <div class=\"card elev-sm\">\n    <sc-if value=\"{{ practice.categoryLabel }}\">\n      <div class=\"card-kicker\" style=\"margin-bottom:6px\">{{ practice.categoryLabel }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <sc-if value=\"{{ practice.subLabel }}\">\n      <div class=\"tag\" style=\"margin-bottom:10px;display:inline-block\">{{ practice.subLabel }}<\u002Fdiv>\n    <\u002Fsc-if>\n    <div class=\"card-title\" style=\"font-size:19px;line-height:1.4;font-weight:400\">{{ practice.text }}<\u002Fdiv>\n    <div style=\"display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-4)\">\n      <sc-for list=\"{{ practice.options }}\" as=\"opt\" hint-placeholder-count=\"5\">\n        <label class=\"radio\" style=\"cursor:pointer;padding:var(--space-2);border-radius:var(--tps-radius-sm);background:{{ opt.bg }}\" sc-camel-on-click=\"{{ opt.onSelect }}\">\n          <span class=\"dot\" style=\"{{ opt.dotStyle }}\"><\u002Fspan>\n          <span><strong>{{ opt.letter }})<\u002Fstrong> {{ opt.text }}<\u002Fspan>\n        <\u002Flabel>\n      <\u002Fsc-for>\n    <\u002Fdiv>\n    <sc-if value=\"{{ practice.answered }}\">\n      <div class=\"card-body\" style=\"margin-top:var(--space-4);font-style:italic;color:var(--color-neutral-700)\">{{ practice.explanation }}<\u002Fdiv>\n      <button class=\"btn btn-primary\" style=\"margin-top:var(--space-4)\" sc-camel-on-click=\"{{ practiceNext }}\">{{ practice.nextLabel }}<\u002Fbutton>\n    <\u002Fsc-if>\n  <\u002Fdiv>\n  <sc-if value=\"{{ practice.finished }}\">\n    <div class=\"card\" style=\"margin-top:var(--space-5)\">\n      <div class=\"card-kicker\">Sessione completata<\u002Fdiv>\n      <div class=\"card-title\">{{ practice.finalScoreLabel }}<\u002Fdiv>\n      <button class=\"btn btn-secondary\" style=\"margin-top:var(--space-3)\" sc-camel-on-click=\"{{ goCategorySetup }}\">Torna alle materie<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isBrowse }}\">\n<div class=\"tps-page-pad\" style=\"max-width:820px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-9)\">\n  <h1 class=\"tps-h1\" style=\"font-family:var(--tps-font-heading);font-size:32px;font-weight:400;margin:0 0 var(--space-5)\">Tutte le domande e spiegazioni<\u002Fh1>\n  <div style=\"display:flex;gap:var(--space-4);margin-bottom:var(--space-6);flex-wrap:wrap\">\n    <div class=\"field\">\n      <label>Anno<\u002Flabel>\n      <sc-raw-select class=\"input\" sc-camel-on-change=\"{{ onBrowseYearChange }}\">\n        <option value=\"all\">Tutti<\u002Foption>\n        <sc-for list=\"{{ years }}\" as=\"y\" hint-placeholder-count=\"3\">\n          <option value=\"{{ y.id }}\">{{ y.label }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n    <div class=\"field\">\n      <label>Materia<\u002Flabel>\n      <sc-raw-select class=\"input\" sc-camel-on-change=\"{{ onBrowseCategoryChange }}\">\n        <option value=\"all\">Tutte<\u002Foption>\n        <sc-for list=\"{{ categories }}\" as=\"c\" hint-placeholder-count=\"5\">\n          <option value=\"{{ c.id }}\">{{ c.label }}<\u002Foption>\n        <\u002Fsc-for>\n      <\u002Fsc-raw-select>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <sc-for list=\"{{ browseList }}\" as=\"bq\" hint-placeholder-count=\"10\">\n    <div class=\"card\" style=\"margin-bottom:var(--space-4)\">\n      <div class=\"card-kicker\">{{ bq.yearLabel }} · {{ bq.categoryLabel }}<\u002Fdiv>\n      <div class=\"card-title\" style=\"font-size:16px;font-weight:400\">{{ bq.text }}<\u002Fdiv>\n      <sc-for list=\"{{ bq.options }}\" as=\"op\" hint-placeholder-count=\"5\">\n        <div style=\"padding:4px 0;color:{{ op.color }};font-weight:{{ op.weight }}\">{{ op.letter }}) {{ op.text }}<\u002Fdiv>\n      <\u002Fsc-for>\n      <div class=\"card-body\" style=\"margin-top:var(--space-3);font-style:italic;color:var(--color-neutral-700)\">{{ bq.explanation }}<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDashboard }}\">\n<div class=\"tps-page-pad\" style=\"max-width:820px;margin:0 auto;padding:var(--space-6) var(--space-6) var(--space-9)\">\n  <h1 class=\"tps-h1\" style=\"font-family:var(--tps-font-heading);font-size:32px;font-weight:400;margin:0 0 var(--space-6)\">Statistiche<\u002Fh1>\n\n  <div class=\"tps-dashboard-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);margin-bottom:var(--space-7)\">\n    <div class=\"card\"><div class=\"card-kicker\">Simulazioni<\u002Fdiv><div class=\"card-title\">{{ stats.totalAttempts }}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-kicker\">Punteggio medio<\u002Fdiv><div class=\"card-title\">{{ stats.avgPctLabel }}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-kicker\">Domande esercitate<\u002Fdiv><div class=\"card-title\">{{ stats.totalSeen }}<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ stats.hasAttempts }}\">\n  <h2 style=\"font-family:var(--tps-font-heading);font-size:22px;font-weight:400;margin:0 0 var(--space-4)\">Andamento punteggi<\u002Fh2>\n  <div class=\"card\" style=\"margin-bottom:var(--space-7);padding:var(--space-5)\">\n    <svg sc-camel-view-box=\"0 0 600 200\" width=\"100%\" height=\"200\" sc-camel-preserve-aspect-ratio=\"none\">\n      <line x1=\"0\" y1=\"50\" x2=\"600\" y2=\"50\" stroke=\"var(--color-neutral-200)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"100\" x2=\"600\" y2=\"100\" stroke=\"var(--color-neutral-200)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"150\" x2=\"600\" y2=\"150\" stroke=\"var(--color-neutral-200)\" stroke-width=\"1\"><\u002Fline>\n      <polyline points=\"{{ chartPolyline }}\" fill=\"none\" stroke=\"var(--tps-purple)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n      <sc-for list=\"{{ chartPoints }}\" as=\"pt\" hint-placeholder-count=\"5\">\n        <circle cx=\"{{ pt.x }}\" cy=\"{{ pt.y }}\" r=\"4\" fill=\"var(--tps-purple)\"><\u002Fcircle>\n      <\u002Fsc-for>\n    <\u002Fsvg>\n    <div style=\"display:flex;justify-content:space-between;font-size:12px;color:var(--tps-sub2);margin-top:6px\">\n      <span>{{ chartFirstLabel }}<\u002Fspan><span>{{ chartLastLabel }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <h2 style=\"font-family:var(--tps-font-heading);font-size:22px;font-weight:400;margin:0 0 var(--space-4)\">Per materia<\u002Fh2>\n  <div style=\"margin-bottom:var(--space-7)\">\n    <sc-for list=\"{{ categoryCards }}\" as=\"cc\" hint-placeholder-count=\"5\">\n      <div style=\"margin-bottom:var(--space-3)\">\n        <div style=\"display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px\"><span>{{ cc.label }}<\u002Fspan><span>{{ cc.pctLabel }}<\u002Fspan><\u002Fdiv>\n        <div style=\"height:10px;background:var(--color-neutral-200);border-radius:var(--tps-radius-sm);overflow:hidden\">\n          <div style=\"height:100%;width:{{ cc.pct }}%;background:var(--tps-purple)\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:var(--tps-font-heading);font-size:22px;font-weight:400;margin:0 0 var(--space-4)\">Per anno<\u002Fh2>\n  <sc-raw-table class=\"table\" style=\"margin-bottom:var(--space-7)\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th>Anno<\u002Fsc-raw-th><sc-raw-th>Simulazioni<\u002Fsc-raw-th><sc-raw-th>Punteggio medio<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-for list=\"{{ yearStatsRows }}\" as=\"yr\" hint-placeholder-count=\"3\">\n        <sc-raw-tr><sc-raw-td>{{ yr.label }}<\u002Fsc-raw-td><sc-raw-td>{{ yr.count }}<\u002Fsc-raw-td><sc-raw-td>{{ yr.avgLabel }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-for>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <sc-if value=\"{{ stats.hasAttempts }}\">\n    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetStats }}\">Azzera statistiche<\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst LS_ATTEMPTS = 'tps_attempts_v1';\nconst LS_QSTATS = 'tps_qstats_v1';\nconst CAT_LABELS = {lettura:'Competenze di lettura', ragionamento:'Ragionamento logico e problemi', biologia:'Biologia', chimica:'Chimica', fisica:'Fisica e Matematica'};\n\nconst YEARS = [\n  { id: '2025', label: 'A.A. 2025/2026', ateneo: 'Insubria (Varese-Como)' },\n  { id: '2023', label: 'A.A. 2023/2024', ateneo: 'Pisa' },\n  { id: '2022', label: 'A.A. 2022/2023', ateneo: 'Udine' },\n  { id: 'ai', label: 'Test AI', ateneo: 'Domande originali generate da IA sul syllabus 2026', isAi: true }\n];\n\nconst CATEGORIES = [\n  { id: 'lettura', label: 'Competenze di lettura' },\n  { id: 'ragionamento', label: 'Ragionamento logico e problemi' },\n  { id: 'biologia', label: 'Biologia' },\n  { id: 'chimica', label: 'Chimica' },\n  { id: 'fisica', label: 'Fisica e Matematica' }\n];\n\nfunction q(id, year, category, text, options, explanation) {\n  return { id, year, category, text, options, correctIndex: 0, explanation };\n}\n\n\n\nclass Component extends DCLogic {\n  state = {\n    ready: false,\n    questions: [],\n    view: 'home',\n    attempts: [],\n    qstats: {},\n    simYear: null,\n    navHidden: false,\n    simMinutes: 100,\n    randomCount: 30,\n    test: null,\n    practice: null,\n    browseYear: 'all',\n    browseCategory: 'all',\n    dark: localStorage.getItem('tps_dark_v1') === '1'\n  };\n\n  handleScrollCapture = (e) => {\n    const doc = document.documentElement;\n    const el = e.target === document ? doc : e.target;\n    const y = (el && el.scrollTop) || window.scrollY || 0;\n    const maxY = Math.max((el && el.scrollHeight) || doc.scrollHeight, doc.scrollHeight) - window.innerHeight;\n    const atBottom = y >= maxY - 4;\n    const last = this._lastScrollY != null ? this._lastScrollY : y;\n    const delta = y - last;\n    this._lastScrollY = y;\n    if (y <= 4) { this.setState({ navHidden: false }); return; }\n    if (atBottom) return; // ignore bounce/settle at the very bottom, keep current state\n    if (delta > 4) {\n      if (!this.state.navHidden) this.setState({ navHidden: true });\n    } else if (delta < -4) {\n      if (this.state.navHidden) this.setState({ navHidden: false });\n    }\n  };\n\n  componentDidMount() {\n    this._lastScrollY = window.scrollY;\n    document.addEventListener('scroll', this.handleScrollCapture, { passive: true, capture: true });\n    let attempts = [];\n    let qstats = {};\n    try { attempts = JSON.parse(localStorage.getItem(LS_ATTEMPTS) || '[]'); } catch (e) {}\n    try { qstats = JSON.parse(localStorage.getItem(LS_QSTATS) || '{}'); } catch (e) {}\n    this.YEARS = YEARS;\n    this.CATEGORIES = CATEGORIES;\n    const tryLoad = (attemptsLeft) => {\n      const qs = window.__TPS_QUESTIONS__;\n      if ((qs && qs.length) || attemptsLeft <= 0) {\n        this.setState({ ready: true, questions: qs || [], attempts, qstats });\n      } else {\n        setTimeout(() => tryLoad(attemptsLeft - 1), 50);\n      }\n    };\n    tryLoad(20);\n  }\n\n  saveAttempts(attempts) {\n    localStorage.setItem(LS_ATTEMPTS, JSON.stringify(attempts));\n  }\n  saveQstats(qstats) {\n    localStorage.setItem(LS_QSTATS, JSON.stringify(qstats));\n  }\n\n  shuffle(arr) {\n    const a = arr.slice();\n    for (let i = a.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      [a[i], a[j]] = [a[j], a[i]];\n    }\n    return a;\n  }\n\n  buildShuffledQuestion(q) {\n    const order = this.shuffle([0,1,2,3,4]);\n    const options = order.map(origIdx => q.options[origIdx]);\n    const correctPos = order.indexOf(q.correctIndex);\n    return { id: q.id, year: q.year, category: q.category, text: q.text, options, correctPos, explanation: q.explanation };\n  }\n\n  toggleDark = () => {\n    const dark = !this.state.dark;\n    localStorage.setItem('tps_dark_v1', dark ? '1' : '0');\n    this.setState({ dark });\n  };\n  goHome = () => this.setState({ view: 'home' });\n  goSimSetup = () => this.setState({ view: 'sim-setup', simYear: null });\n  goRandomSetup = () => this.setState({ view: 'random-setup' });\n  goCategorySetup = () => this.setState({ view: 'category-setup' });\n  goBrowse = () => this.setState({ view: 'browse' });\n  goDashboard = () => this.setState({ view: 'dashboard' });\n\n  selectYear = (yid) => this.setState({ simYear: yid });\n  selectMinutes = (m) => this.setState({ simMinutes: m });\n  selectRandomCount = (n) => this.setState({ randomCount: n });\n\n  startSimulation = () => {\n    if (!this.state.simYear) return;\n    let pool = this.state.questions.filter(q => q.year === this.state.simYear);\n    if (pool.length > 60) {\n      pool = [...pool].sort(() => Math.random() - 0.5).slice(0, 60);\n    }\n    this.launchTest(pool, 'year', { year: this.state.simYear });\n  };\n\n  startRandom = () => {\n    const pool = this.shuffle(this.state.questions).slice(0, this.state.randomCount);\n    this.launchTest(pool, 'random', {});\n  };\n\n  launchTest(pool, mode, extra) {\n    const qs = pool.map(q => this.buildShuffledQuestion(q));\n    const test = {\n      mode, ...extra,\n      questions: qs,\n      index: 0,\n      answers: {},\n      startedAt: Date.now(),\n      minutesLimit: this.state.simMinutes,\n      remainingSec: this.state.simMinutes * 60,\n      finished: false\n    };\n    this.setState({ view: 'test-running', test });\n    this._timer = setInterval(() => {\n      const t = this.state.test;\n      if (!t || t.finished) return;\n      const rem = t.remainingSec - 1;\n      if (rem <= 0) { this.finishTest(); return; }\n      this.setState({ test: { ...t, remainingSec: rem } });\n    }, 1000);\n  }\n\n  componentWillUnmount() {\n    if (this._timer) clearInterval(this._timer);\n    document.removeEventListener('scroll', this.handleScrollCapture, { capture: true });\n  }\n\n  selectOption = (posIdx) => {\n    const t = this.state.test;\n    if (!t) return;\n    const q = t.questions[t.index];\n    const answers = { ...t.answers, [q.id]: posIdx };\n    this.setState({ test: { ...t, answers } });\n  };\n\n  nextQuestion = () => {\n    const t = this.state.test;\n    if (t.index < t.questions.length - 1) this.setState({ test: { ...t, index: t.index + 1 } });\n  };\n  prevQuestion = () => {\n    const t = this.state.test;\n    if (t.index > 0) this.setState({ test: { ...t, index: t.index - 1 } });\n  };\n  goToQuestion = (idx) => {\n    const t = this.state.test;\n    this.setState({ test: { ...t, index: idx } });\n  };\n\n  finishTest = () => {\n    if (this._timer) clearInterval(this._timer);\n    const t = this.state.test;\n    let correct = 0, wrong = 0, blank = 0;\n    const qstats = { ...this.state.qstats };\n    t.questions.forEach(q => {\n      const sel = t.answers[q.id];\n      const key = q.id;\n      if (!qstats[key]) qstats[key] = { seen: 0, correct: 0, wrong: 0, category: q.category };\n      if (sel === undefined) { blank++; }\n      else if (sel === q.correctPos) { correct++; qstats[key].correct++; qstats[key].seen++; }\n      else { wrong++; qstats[key].wrong++; qstats[key].seen++; }\n    });\n    const scoreValue = correct * 1.5 - wrong * 0.4;\n    const maxScore = t.questions.length * 1.5;\n    const pct = Math.round((scoreValue / maxScore) * 100);\n    const attempt = {\n      id: 'a' + Date.now(), ts: Date.now(), mode: t.mode, year: t.year || null,\n      total: t.questions.length, correct, wrong, blank, scoreValue, maxScore, pct\n    };\n    const attempts = [...this.state.attempts, attempt];\n    this.saveAttempts(attempts);\n    this.saveQstats(qstats);\n    this.setState({ view: 'review', attempts, qstats, test: { ...t, finished: true, correct, wrong, blank, scoreValue, maxScore, pct } });\n  };\n\n  startPractice = (category, onlyErrors, sub) => {\n    let pool = this.state.questions.filter(q => q.category === category);\n    if (sub) pool = pool.filter(q => q.sub === sub);\n    if (onlyErrors) {\n      const qs = this.state.qstats;\n      pool = pool.filter(q => qs[q.id] && qs[q.id].wrong > 0);\n    }\n    pool = this.shuffle(pool);\n    const queue = pool.map(q => this.buildShuffledQuestion(q));\n    this.setState({\n      view: 'practice',\n      practice: { category, onlyErrors, queue, index: 0, selected: null, answered: false, correctCount: 0, finished: queue.length === 0, repeatMode: false }\n    });\n  };\n\n  startErrorReview = () => {\n    const qs = this.state.qstats;\n    let pool = this.state.questions.filter(q => qs[q.id] && qs[q.id].wrong > 0);\n    pool = this.shuffle(pool);\n    const queue = pool.map(q => this.buildShuffledQuestion(q));\n    this.setState({\n      view: 'practice',\n      practice: { category: null, onlyErrors: true, repeatMode: true, queue, index: 0, selected: null, answered: false, correctCount: 0, finished: queue.length === 0, masteredCount: 0 }\n    });\n  };\n\n  practiceSelect = (posIdx) => {\n    const p = this.state.practice;\n    if (p.answered) return;\n    const q = p.queue[p.index];\n    const isCorrect = posIdx === q.correctPos;\n    const qstats = { ...this.state.qstats };\n    if (!qstats[q.id]) qstats[q.id] = { seen: 0, correct: 0, wrong: 0, category: q.category };\n    qstats[q.id].seen++;\n    if (isCorrect) qstats[q.id].correct++; else qstats[q.id].wrong++;\n    this.saveQstats(qstats);\n    this.setState({ qstats, practice: { ...p, selected: posIdx, answered: true, isCorrect, correctCount: p.correctCount + (isCorrect ? 1 : 0) } });\n  };\n\n  practiceNext = () => {\n    const p = this.state.practice;\n    if (p.repeatMode) {\n      let queue = p.queue.slice();\n      const current = queue[p.index];\n      let masteredCount = p.masteredCount || 0;\n      if (!p.isCorrect) {\n        queue.push(current);\n      } else {\n        masteredCount++;\n      }\n      const nextIndex = p.index + 1;\n      if (nextIndex >= queue.length) {\n        this.setState({ practice: { ...p, queue, finished: true, masteredCount } });\n      } else {\n        this.setState({ practice: { ...p, queue, index: nextIndex, selected: null, answered: false, masteredCount } });\n      }\n      return;\n    }\n    if (p.index >= p.queue.length - 1) {\n      this.setState({ practice: { ...p, finished: true } });\n    } else {\n      this.setState({ practice: { ...p, index: p.index + 1, selected: null, answered: false } });\n    }\n  };\n\n  onBrowseYearChange = (e) => this.setState({ browseYear: e.target.value });\n  onBrowseCategoryChange = (e) => this.setState({ browseCategory: e.target.value });\n\n  resetStats = () => {\n    if (!window.confirm('Azzerare tutte le statistiche e la cronologia delle simulazioni?')) return;\n    localStorage.removeItem(LS_ATTEMPTS);\n    localStorage.removeItem(LS_QSTATS);\n    this.setState({ attempts: [], qstats: {} });\n  };\n\n  buildChart() {\n    const attempts = this.state.attempts.slice(-12);\n    if (!attempts.length) return { chartPolyline: '', chartPoints: [], chartFirstLabel: '', chartLastLabel: '' };\n    const n = attempts.length;\n    const points = attempts.map((a, i) => {\n      const x = n === 1 ? 300 : Math.round((i / (n - 1)) * 600);\n      const y = Math.round(180 - (Math.max(0, Math.min(100, a.pct)) / 100) * 160);\n      return { x, y };\n    });\n    const fmt = (a) => a.ts ? new Date(a.ts).toLocaleDateString('it-IT', { day: '2-digit', month: 'short' }) : '';\n    return {\n      chartPolyline: points.map(p => p.x + ',' + p.y).join(' '),\n      chartPoints: points,\n      chartFirstLabel: fmt(attempts[0]),\n      chartLastLabel: fmt(attempts[n - 1])\n    };\n  }\n\n  computeStats() {\n    const attempts = this.state.attempts;\n    const qstats = this.state.qstats;\n    const totalAttempts = attempts.length;\n    const avgPct = totalAttempts ? Math.round(attempts.reduce((s,a)=>s+a.pct,0)/totalAttempts) : 0;\n    let totalSeen = 0;\n    Object.values(qstats).forEach(s => totalSeen += s.seen);\n    return {\n      totalAttempts, avgPctLabel: totalAttempts ? avgPct + '%' : '—',\n      totalSeen, hasAttempts: totalAttempts > 0\n    };\n  }\n\n  renderVals() {\n    if (!this.state.ready) return { ready: false, readyHome: false, dateline: '' };\n    const view = this.state.view;\n    const stats = this.computeStats();\n    const years = this.YEARS;\n    const categories = this.CATEGORIES;\n\n    const yearAttemptStats = (yid) => {\n      const a = this.state.attempts.filter(x => x.mode === 'year' && x.year === yid);\n      if (!a.length) return { count: 0, avgPct: null };\n      return { count: a.length, avgPct: Math.round(a.reduce((s,x)=>s+x.pct,0)/a.length) };\n    };\n\n    const categoryStat = (cid) => {\n      let seen = 0, correct = 0, wrong = 0;\n      Object.values(this.state.qstats).forEach(s => { if (s.category === cid) { seen += s.seen; correct += s.correct; wrong += s.wrong; } });\n      const pct = seen ? Math.round((correct/seen)*100) : 0;\n      return { seen, correct, wrong, pct };\n    };\n\n    const categoryCards = categories.map(c => {\n      const st = categoryStat(c.id);\n      const count = this.state.questions.filter(q => q.category === c.id).length;\n      return {\n        id: c.id, label: c.label, count,\n        pct: st.seen ? st.pct : 0,\n        pctLabel: st.seen ? st.pct + '%' : 'Non ancora esercitato',\n        hasErrors: st.wrong > 0, errorCount: st.wrong,\n        onPractice: () => this.startPractice(c.id, false),\n        onPracticeErrors: () => this.startPractice(c.id, true),\n        subs: (window.TPS_SUB_LABELS[c.id] || []).map(sb => ({\n          label: sb,\n          count: this.state.questions.filter(q => q.category === c.id && q.sub === sb).length,\n          onClick: () => this.startPractice(c.id, false, sb)\n        })).filter(sb => sb.count > 0)\n      };\n    });\n\n    const yearCards = years.map((y, yi) => {\n      const hs = yearAttemptStats(y.id);\n      const count = this.state.questions.filter(q => q.year === y.id).length;\n      const isSel = this.state.simYear === y.id;\n      return {\n        id: y.id, label: y.label, ateneo: y.ateneo, count,\n        mark: isSel ? '✓' : String(yi+1).padStart(2,'0'),\n        historyLabel: hs.count ? (hs.count + ' simulazioni svolte · media ' + hs.avgPct + '%') : 'Non ancora provato',\n        rowStyle: isSel ? 'box-shadow:0 0 0 2px var(--tps-purple)' : '',\n        chipBg: 'background:' + (isSel ? 'var(--tps-purple)' : 'var(--color-neutral-500)'),\n        onSelect: () => this.selectYear(y.id)\n      };\n    });\n\n    const yearStatsRows = years.map(y => {\n      const hs = yearAttemptStats(y.id);\n      return { label: y.label, count: hs.count, avgLabel: hs.count ? hs.avgPct + '%' : '—' };\n    });\n\n    const base = {\n      ready: true,\n      dateline: new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }),\n      readyHome: view === 'home',\n      isSimSetup: view === 'sim-setup',\n      isRandomSetup: view === 'random-setup',\n      isCategorySetup: view === 'category-setup',\n      isTestRunning: view === 'test-running',\n      isReview: view === 'review',\n      isPractice: view === 'practice',\n      isBrowse: view === 'browse',\n      isDashboard: view === 'dashboard',\n      navHomeActive: view === 'home' ? 'active' : '',\n      navStatsActive: view === 'dashboard' ? 'active' : '',\n      navBrowseActive: view === 'browse' ? 'active' : '',\n      navHiddenClass: this.state.navHidden ? 'tps-nav-hidden' : '',\n      dark: this.state.dark, toggleDark: this.toggleDark, darkClass: this.state.dark ? 'tps-dark' : '',\n      goHome: this.goHome, goSimSetup: this.goSimSetup, goRandomSetup: this.goRandomSetup,\n      goCategorySetup: this.goCategorySetup, goBrowse: this.goBrowse, goDashboard: this.goDashboard,\n      stats, categoryCards, yearCards, yearStatsRows,\n      ...this.buildChart(),\n      homeSimCountLabel: stats.totalAttempts ? ('Media generale: ' + stats.avgPctLabel) : 'Nessuna simulazione ancora svolta',\n      years, categories,\n      totalQuestions: this.state.questions.length,\n      minuteOptions: [30,60,100,150].map(m => ({ label: m + ' min', bg: this.state.simMinutes === m ? 'var(--tps-purple-100)' : 'transparent', onSelect: () => this.selectMinutes(m) })),\n      randomCountOptions: [10,20,30,60].map(n => ({ label: n + ' domande', bg: this.state.randomCount === n ? 'var(--tps-purple-100)' : 'transparent', onSelect: () => this.selectRandomCount(n) })),\n      simYear: this.state.simYear,\n      startSimulation: this.startSimulation, startRandom: this.startRandom,\n      resetStats: this.resetStats,\n      onBrowseYearChange: this.onBrowseYearChange, onBrowseCategoryChange: this.onBrowseCategoryChange,\n      nextQuestion: this.nextQuestion, prevQuestion: this.prevQuestion, finishTest: this.finishTest,\n      practiceNext: this.practiceNext, startErrorReview: this.startErrorReview,\n      totalErrorCount: Object.values(this.state.qstats).filter(s => s.wrong > 0).length\n    };\n\n    if (view === 'test-running' && this.state.test) {\n      const t = this.state.test;\n      const q = t.questions[t.index];\n      const letters = ['A','B','C','D','E'];\n      const mm = Math.floor(t.remainingSec/60), ss = t.remainingSec%60;\n      base.testHeaderLabel = t.mode === 'year' ? ('Simulazione ' + (years.find(y=>y.id===t.year)||{}).label) : (t.mode === 'random' ? 'Domande casuali' : t.mode);\n      base.timeLeftLabel = String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');\n      base.progressDots = t.questions.map((qq, i) => {\n        const answered = t.answers[qq.id] !== undefined;\n        return { num: i+1, bg: i===t.index ? 'var(--tps-purple)' : (answered ? 'var(--tps-purple-200)' : 'var(--tps-bg)'), color: i===t.index ? '#fff' : 'var(--tps-ink)', onGo: () => this.goToQuestion(i) };\n      });\n      base.currentQ = {\n        index: t.index+1, total: t.questions.length, isFirst: t.index===0, isLast: t.index===t.questions.length-1,\n        categoryLabel: CAT_LABELS[q.category], text: q.text,\n        options: q.options.map((opt,i) => ({\n          letter: letters[i], text: opt,\n          bg: t.answers[q.id]===i ? 'var(--tps-purple-100)' : 'transparent',\n          dotStyle: t.answers[q.id]===i ? 'background:var(--tps-purple)' : '',\n          onSelect: () => this.selectOption(i)\n        }))\n      };\n    }\n\n    if (view === 'review' && this.state.test) {\n      const t = this.state.test;\n      const letters = ['A','B','C','D','E'];\n      base.review = {\n        scoreLabel: t.scoreValue.toFixed(1) + ' / ' + t.maxScore.toFixed(1) + ' (' + t.pct + '%)',\n        correct: t.correct, wrong: t.wrong, blank: t.blank,\n        items: t.questions.map((q,i) => {\n          const sel = t.answers[q.id];\n          const stripColor = sel === undefined ? 'var(--color-neutral-300)' : (sel === q.correctPos ? 'var(--tps-purple)' : 'var(--tps-pink)');\n          return {\n            num: i+1, categoryLabel: CAT_LABELS[q.category], yearLabel: (years.find(y=>y.id===q.year)||{}).label,\n            text: q.text, stripColor, explanation: q.explanation,\n            options: q.options.map((opt,oi) => {\n              let badge = '';\n              if (oi === q.correctPos) badge = '✓ corretta';\n              else if (oi === sel) badge = '✗ tua risposta';\n              return {\n                letter: letters[oi], text: opt, badge,\n                textColor: oi === q.correctPos ? 'var(--tps-purple-700)' : (oi === sel ? 'var(--tps-pink-700)' : 'var(--tps-ink)'),\n                weight: (oi === q.correctPos || oi === sel) ? 600 : 400\n              };\n            })\n          };\n        })\n      };\n    }\n\n    if (view === 'practice' && this.state.practice) {\n      const p = this.state.practice;\n      const letters = ['A','B','C','D','E'];\n      if (!p.finished && p.queue.length) {\n        const q = p.queue[p.index];\n        const headerLabel = p.repeatMode ? 'Ripasso errori' : (CAT_LABELS[p.category] + (p.onlyErrors ? ' · ripasso errori' : ''));\n        base.practice = {\n          headerLabel,\n          index: p.index+1, total: p.queue.length, text: q.text, answered: p.answered,\n          categoryLabel: p.repeatMode ? CAT_LABELS[q.category] : null,\n          subLabel: q.sub || null,\n          explanation: q.explanation,\n          finished: false,\n          nextLabel: p.repeatMode ? (p.index >= p.queue.length-1 ? 'Termina ripasso' : 'Prossima →') : (p.index >= p.queue.length-1 ? 'Termina sessione' : 'Prossima domanda →'),\n          options: q.options.map((opt,i) => {\n            let bg = 'transparent';\n            if (p.answered) {\n              if (i === q.correctPos) bg = 'var(--tps-purple-100)';\n              else if (i === p.selected) bg = 'var(--tps-pink-100)';\n            } else if (i === p.selected) bg = 'var(--tps-purple-100)';\n            return { letter: letters[i], text: opt, bg, dotStyle: '', onSelect: () => this.practiceSelect(i) };\n          })\n        };\n      } else {\n        base.practice = { finished: true, headerLabel: p.repeatMode ? 'Ripasso errori' : CAT_LABELS[p.category], index: p.queue.length, total: p.queue.length,\n          finalScoreLabel: p.repeatMode\n            ? (p.queue.length ? ('Hai ripassato ' + (p.masteredCount||0) + ' domande fino a saperle') : 'Nessun errore da ripassare: ottimo lavoro!')\n            : (p.queue.length ? ('Corrette: ' + p.correctCount + ' / ' + p.queue.length) : 'Nessuna domanda da ripassare: ottimo lavoro!'),\n          options: [] };\n      }\n    }\n\n    if (view === 'browse') {\n      const letters = ['A','B','C','D','E'];\n      base.browseList = this.state.questions\n        .filter(q => (this.state.browseYear==='all' || q.year===this.state.browseYear) && (this.state.browseCategory==='all' || q.category===this.state.browseCategory))\n        .map(q => ({\n          yearLabel: (years.find(y=>y.id===q.year)||{}).label, categoryLabel: CAT_LABELS[q.category], text: q.text,\n          explanation: q.explanation,\n          options: q.options.map((opt,i) => ({ letter: letters[i], text: opt, color: i===q.correctIndex ? 'var(--tps-purple-700)' : 'var(--tps-ink)', weight: i===q.correctIndex ? 600 : 400 }))\n        }));\n    }\n\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
