-9)\">\n  <h1 class=\"tps-h1\" style=\"font-family:var(--tps-font-heading);font-size:32px;font-weight:400;margin:0 0 var(--space-6)\">Statistiche<\u002Fh1>\n\n  <div class=\"tps-dashboard-grid\" style=\"display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-4);margin-bottom:var(--space-7)\">\n    <div class=\"card\"><div class=\"card-kicker\">Simulazioni<\u002Fdiv><div class=\"card-title\">{{ stats.totalAttempts }}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-kicker\">Punteggio medio<\u002Fdiv><div class=\"card-title\">{{ stats.avgPctLabel }}<\u002Fdiv><\u002Fdiv>\n    <div class=\"card\"><div class=\"card-kicker\">Domande esercitate<\u002Fdiv><div class=\"card-title\">{{ stats.totalSeen }}<\u002Fdiv><\u002Fdiv>\n  <\u002Fdiv>\n\n  <sc-if value=\"{{ stats.hasAttempts }}\">\n  <h2 style=\"font-family:var(--tps-font-heading);font-size:22px;font-weight:400;margin:0 0 var(--space-4)\">Andamento punteggi<\u002Fh2>\n  <div class=\"card\" style=\"margin-bottom:var(--space-7);padding:var(--space-5)\">\n    <svg sc-camel-view-box=\"0 0 600 200\" width=\"100%\" height=\"200\" sc-camel-preserve-aspect-ratio=\"none\">\n      <line x1=\"0\" y1=\"50\" x2=\"600\" y2=\"50\" stroke=\"var(--color-neutral-200)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"100\" x2=\"600\" y2=\"100\" stroke=\"var(--color-neutral-200)\" stroke-width=\"1\"><\u002Fline>\n      <line x1=\"0\" y1=\"150\" x2=\"600\" y2=\"150\" stroke=\"var(--color-neutral-200)\" stroke-width=\"1\"><\u002Fline>\n      <polyline points=\"{{ chartPolyline }}\" fill=\"none\" stroke=\"var(--tps-purple)\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><\u002Fpolyline>\n      <sc-for list=\"{{ chartPoints }}\" as=\"pt\" hint-placeholder-count=\"5\">\n        <circle cx=\"{{ pt.x }}\" cy=\"{{ pt.y }}\" r=\"4\" fill=\"var(--tps-purple)\"><\u002Fcircle>\n      <\u002Fsc-for>\n    <\u002Fsvg>\n    <div style=\"display:flex;justify-content:space-between;font-size:12px;color:var(--tps-sub2);margin-top:6px\">\n      <span>{{ chartFirstLabel }}<\u002Fspan><span>{{ chartLastLabel }}<\u002Fspan>\n    <\u002Fdiv>\n  <\u002Fdiv>\n  <\u002Fsc-if>\n\n  <h2 style=\"font-family:var(--tps-font-heading);font-size:22px;font-weight:400;margin:0 0 var(--space-4)\">Per materia<\u002Fh2>\n  <div style=\"margin-bottom:var(--space-7)\">\n    <sc-for list=\"{{ categoryCards }}\" as=\"cc\" hint-placeholder-count=\"5\">\n      <div style=\"margin-bottom:var(--space-3)\">\n        <div style=\"display:flex;justify-content:space-between;font-size:14px;margin-bottom:4px\"><span>{{ cc.label }}<\u002Fspan><span>{{ cc.pctLabel }}<\u002Fspan><\u002Fdiv>\n        <div style=\"height:10px;background:var(--color-neutral-200);border-radius:var(--tps-radius-sm);overflow:hidden\">\n          <div style=\"height:100%;width:{{ cc.pct }}%;background:var(--tps-purple)\"><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fsc-for>\n  <\u002Fdiv>\n\n  <h2 style=\"font-family:var(--tps-font-heading);font-size:22px;font-weight:400;margin:0 0 var(--space-4)\">Per anno<\u002Fh2>\n  <sc-raw-table class=\"table\" style=\"margin-bottom:var(--space-7)\">\n    <sc-raw-thead><sc-raw-tr><sc-raw-th>Anno<\u002Fsc-raw-th><sc-raw-th>Simulazioni<\u002Fsc-raw-th><sc-raw-th>Punteggio medio<\u002Fsc-raw-th><\u002Fsc-raw-tr><\u002Fsc-raw-thead>\n    <sc-raw-tbody>\n      <sc-for list=\"{{ yearStatsRows }}\" as=\"yr\" hint-placeholder-count=\"3\">\n        <sc-raw-tr><sc-raw-td>{{ yr.label }}<\u002Fsc-raw-td><sc-raw-td>{{ yr.count }}<\u002Fsc-raw-td><sc-raw-td>{{ yr.avgLabel }}<\u002Fsc-raw-td><\u002Fsc-raw-tr>\n      <\u002Fsc-for>\n    <\u002Fsc-raw-tbody>\n  <\u002Fsc-raw-table>\n\n  <sc-if value=\"{{ stats.hasAttempts }}\">\n    <button class=\"btn btn-ghost\" sc-camel-on-click=\"{{ resetStats }}\">Azzera statistiche<\u002Fbutton>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n]]&gt;\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nconst LS_ATTEMPTS = 'tps_attempts_v1';\nconst LS_QSTATS = 'tps_qstats_v1';\nconst CAT_LABELS = {lettura:'Competenze di lettura', ragionamento:'Ragionamento logico e problemi', biologia:'Biologia', chimica:'Chimica', fisica:'Fisica e Matematica'};\n\nconst YEARS = [\n  { id: '2025', label: 'A.A. 2025/2026', ateneo: 'Insubria (Varese-Como)' },\n  { id: '2023', label: 'A.A. 2023/2024', ateneo: 'Pisa' },\n  { id: '2022', label: 'A.A. 2022/2023', ateneo: 'Udine' },\n  { id: 'ai', label: 'Test AI', ateneo: 'Domande originali generate da IA sul syllabus 2026', isAi: true }\n];\n\nconst CATEGORIES = [\n  { id: 'lettura', label: 'Competenze di lettura' },\n  { id: 'ragionamento', label: 'Ragionamento logico e problemi' },\n  { id: 'biologia', label: 'Biologia' },\n  { id: 'chimica', label: 'Chimica' },\n  { id: 'fisica', label: 'Fisica e Matematica' }\n];\n\nfunction q(id, year, category, text, options, explanation) {\n  return { id, year, category, text, options, correctIndex: 0, explanation };\n}\n\n\n\nclass Component extends DCLogic {\n  state = {\n    ready: false,\n    questions: [],\n    view: 'home',\n    attempts: [],\n    qstats: {},\n    simYear: null,\n    navHidden: false,\n    simMinutes: 100,\n    randomCount: 30,\n    test: null,\n    practice: null,\n    browseYear: 'all',\n    browseCategory: 'all',\n    dark: localStorage.getItem('tps_dark_v1') === '1'\n  };\n\n  handleScroll = () => {\n    const y = window.scrollY;\n    const last = this._lastScrollY || 0;\n    if (Math.abs(y - last) > 8) {\n      const hidden = y > last && y > 80;\n      if (hidden !== this.state.navHidden) this.setState({ navHidden: hidden });\n      this._lastScrollY = y;\n    }\n  };\n\n  componentDidMount() {\n    this._lastScrollY = window.scrollY;\n    window.addEventListener('scroll', this.handleScroll, { passive: true });\n    let attempts = [];\n    let qstats = {};\n    try { attempts = JSON.parse(localStorage.getItem(LS_ATTEMPTS) || '[]'); } catch (e) {}\n    try { qstats = JSON.parse(localStorage.getItem(LS_QSTATS) || '{}'); } catch (e) {}\n    this.YEARS = YEARS;\n    this.CATEGORIES = CATEGORIES;\n    const tryLoad = (attemptsLeft) => {\n      const qs = window.__TPS_QUESTIONS__;\n      if ((qs && qs.length) || attemptsLeft <= 0) {\n        this.setState({ ready: true, questions: qs || [], attempts, qstats });\n      } else {\n        setTimeout(() => tryLoad(attemptsLeft - 1), 50);\n      }\n    };\n    tryLoad(20);\n  }\n\n  saveAttempts(attempts) {\n    localStorage.setItem(LS_ATTEMPTS, JSON.stringify(attempts));\n  }\n  saveQstats(qstats) {\n    localStorage.setItem(LS_QSTATS, JSON.stringify(qstats));\n  }\n\n  shuffle(arr) {\n    const a = arr.slice();\n    for (let i = a.length - 1; i > 0; i--) {\n      const j = Math.floor(Math.random() * (i + 1));\n      [a[i], a[j]] = [a[j], a[i]];\n    }\n    return a;\n  }\n\n  buildShuffledQuestion(q) {\n    const order = this.shuffle([0,1,2,3,4]);\n    const options = order.map(origIdx => q.options[origIdx]);\n    const correctPos = order.indexOf(q.correctIndex);\n    return { id: q.id, year: q.year, category: q.category, text: q.text, options, correctPos, explanation: q.explanation };\n  }\n\n  toggleDark = () => {\n    const dark = !this.state.dark;\n    localStorage.setItem('tps_dark_v1', dark ? '1' : '0');\n    this.setState({ dark });\n  };\n  goHome = () => this.setState({ view: 'home' });\n  goSimSetup = () => this.setState({ view: 'sim-setup', simYear: null });\n  goRandomSetup = () => this.setState({ view: 'random-setup' });\n  goCategorySetup = () => this.setState({ view: 'category-setup' });\n  goBrowse = () => this.setState({ view: 'browse' });\n  goDashboard = () => this.setState({ view: 'dashboard' });\n\n  selectYear = (yid) => this.setState({ simYear: yid });\n  selectMinutes = (m) => this.setState({ simMinutes: m });\n  selectRandomCount = (n) => this.setState({ randomCount: n });\n\n  startSimulation = () => {\n    if (!this.state.simYear) return;\n    let pool = this.state.questions.filter(q => q.year === this.state.simYear);\n    if (pool.length > 60) {\n      pool = [...pool].sort(() => Math.random() - 0.5).slice(0, 60);\n    }\n    this.launchTest(pool, 'year', { year: this.state.simYear });\n  };\n\n  startRandom = () => {\n    const pool = this.shuffle(this.state.questions).slice(0, this.state.randomCount);\n    this.launchTest(pool, 'random', {});\n  };\n\n  launchTest(pool, mode, extra) {\n    const qs = pool.map(q => this.buildShuffledQuestion(q));\n    const test = {\n      mode, ...extra,\n      questions: qs,\n      index: 0,\n      answers: {},\n      startedAt: Date.now(),\n      minutesLimit: this.state.simMinutes,\n      remainingSec: this.state.simMinutes * 60,\n      finished: false\n    };\n    this.setState({ view: 'test-running', test });\n    this._timer = setInterval(() => {\n      const t = this.state.test;\n      if (!t || t.finished) return;\n      const rem = t.remainingSec - 1;\n      if (rem <= 0) { this.finishTest(); return; }\n      this.setState({ test: { ...t, remainingSec: rem } });\n    }, 1000);\n  }\n\n  componentWillUnmount() {\n    if (this._timer) clearInterval(this._timer);\n    window.removeEventListener('scroll', this.handleScroll);\n  }\n\n  selectOption = (posIdx) => {\n    const t = this.state.test;\n    if (!t) return;\n    const q = t.questions[t.index];\n    const answers = { ...t.answers, [q.id]: posIdx };\n    this.setState({ test: { ...t, answers } });\n  };\n\n  nextQuestion = () => {\n    const t = this.state.test;\n    if (t.index < t.questions.length - 1) this.setState({ test: { ...t, index: t.index + 1 } });\n  };\n  prevQuestion = () => {\n    const t = this.state.test;\n    if (t.index > 0) this.setState({ test: { ...t, index: t.index - 1 } });\n  };\n  goToQuestion = (idx) => {\n    const t = this.state.test;\n    this.setState({ test: { ...t, index: idx } });\n  };\n\n  finishTest = () => {\n    if (this._timer) clearInterval(this._timer);\n    const t = this.state.test;\n    let correct = 0, wrong = 0, blank = 0;\n    const qstats = { ...this.state.qstats };\n    t.questions.forEach(q => {\n      const sel = t.answers[q.id];\n      const key = q.id;\n      if (!qstats[key]) qstats[key] = { seen: 0, correct: 0, wrong: 0, category: q.category };\n      if (sel === undefined) { blank++; }\n      else if (sel === q.correctPos) { correct++; qstats[key].correct++; qstats[key].seen++; }\n      else { wrong++; qstats[key].wrong++; qstats[key].seen++; }\n    });\n    const scoreValue = correct * 1.5 - wrong * 0.4;\n    const maxScore = t.questions.length * 1.5;\n    const pct = Math.round((scoreValue / maxScore) * 100);\n    const attempt = {\n      id: 'a' + Date.now(), ts: Date.now(), mode: t.mode, year: t.year || null,\n      total: t.questions.length, correct, wrong, blank, scoreValue, maxScore, pct\n    };\n    const attempts = [...this.state.attempts, attempt];\n    this.saveAttempts(attempts);\n    this.saveQstats(qstats);\n    this.setState({ view: 'review', attempts, qstats, test: { ...t, finished: true, correct, wrong, blank, scoreValue, maxScore, pct } });\n  };\n\n  startPractice = (category, onlyErrors) => {\n    let pool = this.state.questions.filter(q => q.category === category);\n    if (onlyErrors) {\n      const qs = this.state.qstats;\n      pool = pool.filter(q => qs[q.id] && qs[q.id].wrong > 0);\n    }\n    pool = this.shuffle(pool);\n    const queue = pool.map(q => this.buildShuffledQuestion(q));\n    this.setState({\n      view: 'practice',\n      practice: { category, onlyErrors, queue, index: 0, selected: null, answered: false, correctCount: 0, finished: queue.length === 0, repeatMode: false }\n    });\n  };\n\n  startErrorReview = () => {\n    const qs = this.state.qstats;\n    let pool = this.state.questions.filter(q => qs[q.id] && qs[q.id].wrong > 0);\n    pool = this.shuffle(pool);\n    const queue = pool.map(q => this.buildShuffledQuestion(q));\n    this.setState({\n      view: 'practice',\n      practice: { category: null, onlyErrors: true, repeatMode: true, queue, index: 0, selected: null, answered: false, correctCount: 0, finished: queue.length === 0, masteredCount: 0 }\n    });\n  };\n\n  practiceSelect = (posIdx) => {\n    const p = this.state.practice;\n    if (p.answered) return;\n    const q = p.queue[p.index];\n    const isCorrect = posIdx === q.correctPos;\n    const qstats = { ...this.state.qstats };\n    if (!qstats[q.id]) qstats[q.id] = { seen: 0, correct: 0, wrong: 0, category: q.category };\n    qstats[q.id].seen++;\n    if (isCorrect) qstats[q.id].correct++; else qstats[q.id].wrong++;\n    this.saveQstats(qstats);\n    this.setState({ qstats, practice: { ...p, selected: posIdx, answered: true, isCorrect, correctCount: p.correctCount + (isCorrect ? 1 : 0) } });\n  };\n\n  practiceNext = () => {\n    const p = this.state.practice;\n    if (p.repeatMode) {\n      let queue = p.queue.slice();\n      const current = queue[p.index];\n      let masteredCount = p.masteredCount || 0;\n      if (!p.isCorrect) {\n        queue.push(current);\n      } else {\n        masteredCount++;\n      }\n      const nextIndex = p.index + 1;\n      if (nextIndex >= queue.length) {\n        this.setState({ practice: { ...p, queue, finished: true, masteredCount } });\n      } else {\n        this.setState({ practice: { ...p, queue, index: nextIndex, selected: null, answered: false, masteredCount } });\n      }\n      return;\n    }\n    if (p.index >= p.queue.length - 1) {\n      this.setState({ practice: { ...p, finished: true } });\n    } else {\n      this.setState({ practice: { ...p, index: p.index + 1, selected: null, answered: false } });\n    }\n  };\n\n  onBrowseYearChange = (e) => this.setState({ browseYear: e.target.value });\n  onBrowseCategoryChange = (e) => this.setState({ browseCategory: e.target.value });\n\n  resetStats = () => {\n    if (!window.confirm('Azzerare tutte le statistiche e la cronologia delle simulazioni?')) return;\n    localStorage.removeItem(LS_ATTEMPTS);\n    localStorage.removeItem(LS_QSTATS);\n    this.setState({ attempts: [], qstats: {} });\n  };\n\n  buildChart() {\n    const attempts = this.state.attempts.slice(-12);\n    if (!attempts.length) return { chartPolyline: '', chartPoints: [], chartFirstLabel: '', chartLastLabel: '' };\n    const n = attempts.length;\n    const points = attempts.map((a, i) => {\n      const x = n === 1 ? 300 : Math.round((i / (n - 1)) * 600);\n      const y = Math.round(180 - (Math.max(0, Math.min(100, a.pct)) / 100) * 160);\n      return { x, y };\n    });\n    const fmt = (a) => a.ts ? new Date(a.ts).toLocaleDateString('it-IT', { day: '2-digit', month: 'short' }) : '';\n    return {\n      chartPolyline: points.map(p => p.x + ',' + p.y).join(' '),\n      chartPoints: points,\n      chartFirstLabel: fmt(attempts[0]),\n      chartLastLabel: fmt(attempts[n - 1])\n    };\n  }\n\n  computeStats() {\n    const attempts = this.state.attempts;\n    const qstats = this.state.qstats;\n    const totalAttempts = attempts.length;\n    const avgPct = totalAttempts ? Math.round(attempts.reduce((s,a)=>s+a.pct,0)/totalAttempts) : 0;\n    let totalSeen = 0;\n    Object.values(qstats).forEach(s => totalSeen += s.seen);\n    return {\n      totalAttempts, avgPctLabel: totalAttempts ? avgPct + '%' : '—',\n      totalSeen, hasAttempts: totalAttempts > 0\n    };\n  }\n\n  renderVals() {\n    if (!this.state.ready) return { ready: false, readyHome: false, dateline: '' };\n    const view = this.state.view;\n    const stats = this.computeStats();\n    const years = this.YEARS;\n    const categories = this.CATEGORIES;\n\n    const yearAttemptStats = (yid) => {\n      const a = this.state.attempts.filter(x => x.mode === 'year' && x.year === yid);\n      if (!a.length) return { count: 0, avgPct: null };\n      return { count: a.length, avgPct: Math.round(a.reduce((s,x)=>s+x.pct,0)/a.length) };\n    };\n\n    const categoryStat = (cid) => {\n      let seen = 0, correct = 0, wrong = 0;\n      Object.values(this.state.qstats).forEach(s => { if (s.category === cid) { seen += s.seen; correct += s.correct; wrong += s.wrong; } });\n      const pct = seen ? Math.round((correct/seen)*100) : 0;\n      return { seen, correct, wrong, pct };\n    };\n\n    const categoryCards = categories.map(c => {\n      const st = categoryStat(c.id);\n      const count = this.state.questions.filter(q => q.category === c.id).length;\n      return {\n        id: c.id, label: c.label, count,\n        pct: st.seen ? st.pct : 0,\n        pctLabel: st.seen ? st.pct + '%' : 'Non ancora esercitato',\n        hasErrors: st.wrong > 0, errorCount: st.wrong,\n        onPractice: () => this.startPractice(c.id, false),\n        onPracticeErrors: () => this.startPractice(c.id, true)\n      };\n    });\n\n    const yearCards = years.map((y, yi) => {\n      const hs = yearAttemptStats(y.id);\n      const count = this.state.questions.filter(q => q.year === y.id).length;\n      const isSel = this.state.simYear === y.id;\n      return {\n        id: y.id, label: y.label, ateneo: y.ateneo, count,\n        mark: isSel ? '✓' : String(yi+1).padStart(2,'0'),\n        historyLabel: hs.count ? (hs.count + ' simulazioni svolte · media ' + hs.avgPct + '%') : 'Non ancora provato',\n        rowStyle: isSel ? 'box-shadow:0 0 0 2px var(--tps-purple)' : '',\n        chipBg: 'background:' + (isSel ? 'var(--tps-purple)' : 'var(--color-neutral-500)'),\n        onSelect: () => this.selectYear(y.id)\n      };\n    });\n\n    const yearStatsRows = years.map(y => {\n      const hs = yearAttemptStats(y.id);\n      return { label: y.label, count: hs.count, avgLabel: hs.count ? hs.avgPct + '%' : '—' };\n    });\n\n    const base = {\n      ready: true,\n      dateline: new Date().toLocaleDateString('it-IT', { day: 'numeric', month: 'long', year: 'numeric' }),\n      readyHome: view === 'home',\n      isSimSetup: view === 'sim-setup',\n      isRandomSetup: view === 'random-setup',\n      isCategorySetup: view === 'category-setup',\n      isTestRunning: view === 'test-running',\n      isReview: view === 'review',\n      isPractice: view === 'practice',\n      isBrowse: view === 'browse',\n      isDashboard: view === 'dashboard',\n      navHomeActive: view === 'home' ? 'active' : '',\n      navStatsActive: view === 'dashboard' ? 'active' : '',\n      navBrowseActive: view === 'browse' ? 'active' : '',\n      navHiddenClass: this.state.navHidden ? 'tps-nav-hidden' : '',\n      dark: this.state.dark, toggleDark: this.toggleDark, darkClass: this.state.dark ? 'tps-dark' : '',\n      goHome: this.goHome, goSimSetup: this.goSimSetup, goRandomSetup: this.goRandomSetup,\n      goCategorySetup: this.goCategorySetup, goBrowse: this.goBrowse, goDashboard: this.goDashboard,\n      stats, categoryCards, yearCards, yearStatsRows,\n      ...this.buildChart(),\n      homeSimCountLabel: stats.totalAttempts ? ('Media generale: ' + stats.avgPctLabel) : 'Nessuna simulazione ancora svolta',\n      years, categories,\n      totalQuestions: this.state.questions.length,\n      minuteOptions: [30,60,100,150].map(m => ({ label: m + ' min', bg: this.state.simMinutes === m ? 'var(--tps-purple-100)' : 'transparent', onSelect: () => this.selectMinutes(m) })),\n      randomCountOptions: [10,20,30,60].map(n => ({ label: n + ' domande', bg: this.state.randomCount === n ? 'var(--tps-purple-100)' : 'transparent', onSelect: () => this.selectRandomCount(n) })),\n      simYear: this.state.simYear,\n      startSimulation: this.startSimulation, startRandom: this.startRandom,\n      resetStats: this.resetStats,\n      onBrowseYearChange: this.onBrowseYearChange, onBrowseCategoryChange: this.onBrowseCategoryChange,\n      nextQuestion: this.nextQuestion, prevQuestion: this.prevQuestion, finishTest: this.finishTest,\n      practiceNext: this.practiceNext, startErrorReview: this.startErrorReview,\n      totalErrorCount: Object.values(this.state.qstats).filter(s => s.wrong > 0).length\n    };\n\n    if (view === 'test-running' && this.state.test) {\n      const t = this.state.test;\n      const q = t.questions[t.index];\n      const letters = ['A','B','C','D','E'];\n      const mm = Math.floor(t.remainingSec/60), ss = t.remainingSec%60;\n      base.testHeaderLabel = t.mode === 'year' ? ('Simulazione ' + (years.find(y=>y.id===t.year)||{}).label) : (t.mode === 'random' ? 'Domande casuali' : t.mode);\n      base.timeLeftLabel = String(mm).padStart(2,'0') + ':' + String(ss).padStart(2,'0');\n      base.progressDots = t.questions.map((qq, i) => {\n        const answered = t.answers[qq.id] !== undefined;\n        return { num: i+1, bg: i===t.index ? 'var(--tps-purple)' : (answered ? 'var(--tps-purple-200)' : 'var(--tps-bg)'), color: i===t.index ? '#fff' : 'var(--tps-ink)', onGo: () => this.goToQuestion(i) };\n      });\n      base.currentQ = {\n        index: t.index+1, total: t.questions.length, isFirst: t.index===0, isLast: t.index===t.questions.length-1,\n        categoryLabel: CAT_LABELS[q.category], text: q.text,\n        options: q.options.map((opt,i) => ({\n          letter: letters[i], text: opt,\n          bg: t.answers[q.id]===i ? 'var(--tps-purple-100)' : 'transparent',\n          dotStyle: t.answers[q.id]===i ? 'background:var(--tps-purple)' : '',\n          onSelect: () => this.selectOption(i)\n        }))\n      };\n    }\n\n    if (view === 'review' && this.state.test) {\n      const t = this.state.test;\n      const letters = ['A','B','C','D','E'];\n      base.review = {\n        scoreLabel: t.scoreValue.toFixed(1) + ' / ' + t.maxScore.toFixed(1) + ' (' + t.pct + '%)',\n        correct: t.correct, wrong: t.wrong, blank: t.blank,\n        items: t.questions.map((q,i) => {\n          const sel = t.answers[q.id];\n          const stripColor = sel === undefined ? 'var(--color-neutral-300)' : (sel === q.correctPos ? 'var(--tps-purple)' : 'var(--tps-pink)');\n          return {\n            num: i+1, categoryLabel: CAT_LABELS[q.category], yearLabel: (years.find(y=>y.id===q.year)||{}).label,\n            text: q.text, stripColor, explanation: q.explanation,\n            options: q.options.map((opt,oi) => {\n              let badge = '';\n              if (oi === q.correctPos) badge = '✓ corretta';\n              else if (oi === sel) badge = '✗ tua risposta';\n              return {\n                letter: letters[oi], text: opt, badge,\n                textColor: oi === q.correctPos ? 'var(--tps-purple-700)' : (oi === sel ? 'var(--tps-pink-700)' : 'var(--tps-ink)'),\n                weight: (oi === q.correctPos || oi === sel) ? 600 : 400\n              };\n            })\n          };\n        })\n      };\n    }\n\n    if (view === 'practice' && this.state.practice) {\n      const p = this.state.practice;\n      const letters = ['A','B','C','D','E'];\n      if (!p.finished && p.queue.length) {\n        const q = p.queue[p.index];\n        const headerLabel = p.repeatMode ? 'Ripasso errori' : (CAT_LABELS[p.category] + (p.onlyErrors ? ' · ripasso errori' : ''));\n        base.practice = {\n          headerLabel,\n          index: p.index+1, total: p.queue.length, text: q.text, answered: p.answered,\n          categoryLabel: p.repeatMode ? CAT_LABELS[q.category] : null,\n          explanation: q.explanation,\n          finished: false,\n          nextLabel: p.repeatMode ? (p.index >= p.queue.length-1 ? 'Termina ripasso' : 'Prossima →') : (p.index >= p.queue.length-1 ? 'Termina sessione' : 'Prossima domanda →'),\n          options: q.options.map((opt,i) => {\n            let bg = 'transparent';\n            if (p.answered) {\n              if (i === q.correctPos) bg = 'var(--tps-purple-100)';\n              else if (i === p.selected) bg = 'var(--tps-pink-100)';\n            } else if (i === p.selected) bg = 'var(--tps-purple-100)';\n            return { letter: letters[i], text: opt, bg, dotStyle: '', onSelect: () => this.practiceSelect(i) };\n          })\n        };\n      } else {\n        base.practice = { finished: true, headerLabel: p.repeatMode ? 'Ripasso errori' : CAT_LABELS[p.category], index: p.queue.length, total: p.queue.length,\n          finalScoreLabel: p.repeatMode\n            ? (p.queue.length ? ('Hai ripassato ' + (p.masteredCount||0) + ' domande fino a saperle') : 'Nessun errore da ripassare: ottimo lavoro!')\n            : (p.queue.length ? ('Corrette: ' + p.correctCount + ' / ' + p.queue.length) : 'Nessuna domanda da ripassare: ottimo lavoro!'),\n          options: [] };\n      }\n    }\n\n    if (view === 'browse') {\n      const letters = ['A','B','C','D','E'];\n      base.browseList = this.state.questions\n        .filter(q => (this.state.browseYear==='all' || q.year===this.state.browseYear) && (this.state.browseCategory==='all' || q.category===this.state.browseCategory))\n        .map(q => ({\n          yearLabel: (years.find(y=>y.id===q.year)||{}).label, categoryLabel: CAT_LABELS[q.category], text: q.text,\n          explanation: q.explanation,\n          options: q.options.map((opt,i) => ({ letter: letters[i], text: opt, color: i===q.correctIndex ? 'var(--tps-purple-700)' : 'var(--tps-ink)', weight: i===q.correctIndex ? 600 : 400 }))\n        }));\n    }\n\n    return base;\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
